# ============================================================================
# VECTOR B — TECHNICAL DOMAINS
# ============================================================================
# DISCIPLINES. Work someone does, not a property of the delivery.
#
# Not a closed budget — it is DEPTH (0..3), and depth is DERIVED from stack
# detection + triage, not chosen by the client.
#
# Override exists, but only UPWARD. The client can ask for more depth in data
# modeling; they cannot ask for less than the nature of the system demands.
# Reason: low weight on data modeling in a data-heavy system is not a
# preference, it is an error — and the framework must not allow erring by
# configuration.
#
# Depth:
#   0 = does not apply to this system
#   1 = covered by the implementation role, no specialist
#   2 = specialist reviews; dedicated artifact required
#   3 = specialist leads; decisions recorded in ADRs
# ============================================================================

[meta]
vector = "B"
kind = "derived_depth"
scale = [0, 3]
override = "upward_only"

[[domain]]
id = "software_architecture"
label = "Software architecture"
artifacts = ["ADR", "module boundaries", "contracts between components"]
derived_from = ["surface_count", "integration_count", "reversibility"]
min_depth_when = "always >= 1"

[[domain]]
id = "data_modeling"
label = "Data modeling & persistence"
artifacts = ["logical model", "migration strategy", "retention policy"]
derived_from = ["has_database", "has_migrations", "data_class"]
min_depth_when = "has_database => >= 2"

[[domain]]
id = "api_contract"
label = "API contract & integration"
artifacts = ["contract spec", "versioning", "backward compatibility"]
derived_from = ["exposes_api", "consumes_external_api"]
min_depth_when = "exposes_api => >= 2"

[[domain]]
id = "design_system"
label = "Design system & UI"
artifacts = ["tokens", "component inventory", "empty/error/loading states"]
derived_from = ["has_frontend", "component_count"]
min_depth_when = "has_frontend => >= 1"

[[domain]]
id = "usability_research"
label = "Usability & research"
artifacts = ["main flow mapped", "user success criteria"]
derived_from = ["has_frontend", "user_facing"]

[[domain]]
id = "qa_test_strategy"
label = "QA & test strategy"
artifacts = ["enumerated failure modes", "eval suite", "golden dataset"]
derived_from = ["always"]
min_depth_when = "always >= 1   # depth 0 contradicts I1"

[[domain]]
id = "platform_delivery"
label = "Platform, delivery & operations"
artifacts = ["pipeline", "runbook", "rollback strategy"]
derived_from = ["has_ci", "deploy_target", "reversibility"]
min_depth_when = "promotes to production => >= 2"

[[domain]]
id = "applied_security"
label = "Applied security (AppSec)"
artifacts = ["threat model", "dependency review", "secret management"]
derived_from = ["data_class", "exposes_api", "auth_present"]
min_depth_when = "data_class in [personal, financial, health] => >= 2"
note = """
Security appears in both vectors on purpose. In vector A it is what the
delivery GUARANTEES (verifiable property). Here it is HOW MUCH specialist WORK
goes in (discipline). It is not redundancy.
"""

[[domain]]
id = "ai_agents"
label = "AI & agents"
artifacts = ["behavior spec", "agent eval suite", "action limits"]
derived_from = ["embeds_model", "has_agent_loop", "has_tool_use"]
min_depth_when = "has_agent_loop => >= 2"
