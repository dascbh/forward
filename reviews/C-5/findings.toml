evidence = """
The plan's deploy step 2 reads 'Its ## Next cycle lists move to backlog.md (ADR-0019 rule 15)'.
Nothing a client runs carries that step:
- grep 'Next cycle|rule 15|B-<n>' finds nothing in skills/fde-sync/SKILL.md or SETUP.md. fde-sync re-runs SETUP §6–8, and those sections have no migration step.
- skills/fde-status only warns, and only for an open cycle (status.py:441, `not c.ended`).
The kernel's docs/adr/ are not installed in clients, yet the client-facing texts cite them by bare id: ADR-0019 ×11, and ADR-0001, 0002, 0010, 0011, 0012, 0014, 0015 and 0018.
In headlabs-platform/docs/adr, 0001, 0002, 0010, 0011, 0012 and 0014 are the client's own unrelated ADRs; ADR-0002 is runtimes-internal-authorization. 0015, 0018 and 0019 do not exist.
Two load-bearing rules become unresolvable there:
- AGENTS.md: 'A cycle opened before ADR-0019 finishes under its own rules'. headlabs C-2 is such a cycle, and the client cannot tell when 'ADR-0019' happened.
- agents/fde-promotion.md: 'promotions/<id>/ is only for a cycle opened before ADR-0019 (rule 15)'.
A9 moved rationale into ADRs that the reader of these texts never has.
