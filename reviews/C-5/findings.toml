[[finding]]
id = "F1"
attribute = "functional_correctness"
severity = "high"
probe = "regression in previously accepted behavior: follow a blocking finding from a 1-round demand review to merge using only AGENTS.md, fde-review and ADR-0019"
evidence = """
AGENTS.md step 5 says a demand review is 'one round' and 'Budget spent with a blocker open → the owner picks (## Cycle); never one more round'.
skills/fde-review/SKILL.md §Budget says 'A demand review is always 1 round' and 'When the budget is spent with a blocking finding open, the owner picks one: narrow / declare / pause'.
So every blocking demand finding spends the budget at once and goes to the owner. The texts give no path to fix it and verify the fix.
Two texts say otherwise:
- AGENTS.md ## Cycle: 'The cycle owns its declared criteria and its blocking findings.'
- ADR-0019 rule 7: 'The only thing that returns to the user is a replan.'
AGENTS.md step 6 merges only with 'no blocking finding open', so the merge is reachable only by the owner narrowing or pausing.
C-5's own board.md did neither. About 20 blocking findings, among them 026 F1–F4, 029 F1–F3, 030 F1–F4 and FWD-032 F1 (blocking), were 'fixed in-cycle' by demands absent from the plan table (FWD-027-fix, RECON-TEXT, RECON-GATE, FWD-033), without the owner and without a verifying round.
The rule the cycle actually followed is written nowhere, and the rule that is written was not followed.
This sits inside the threat model ('cooperative agents that ... contradict each other, or re-ask the owner').
"""
blocking = true   # high, inside the threat model, breaks A8 (no contradiction about the model); A5's merge condition depends on it

[[finding]]
id = "F2"
attribute = "maintainability"
severity = "medium"
principle = "MNT-1"
probe = "case the spec does not cover: who writes state: planned, and when"
evidence = """
AGENTS.md:140-144: 'draft → planned (signed off) → running'; 'fde-spec writes state: draft and state: planned; the orchestrating agent writes state: running at sign-off'.
templates/cycle/plan.md comment: 'state: draft and planned are written by fde-spec'.
skills/fde-backlog/SKILL.md §2 specify: 'Never set state: planned yourself; the owner's sign-off does'. §Never: 'set state: planned/running'.
agents/fde-spec.md: no mention of state at all; line 48 says 'Stop at the sign-off'.
ADR-0019 rule 9 defines planned as 'signed off'. Read literally, the planner stops before sign-off yet writes the signed-off state, and running is also written 'at sign-off'. So planned is either never reached or asserted before approval, and status.py would show an unsigned plan as planned.
AGENTS.md also never names fde-backlog or the backlog → draft → specify step. Its path starts at 'Triage the cycle', so a new agent learns how a draft comes to exist only from the skill's description.
"""
blocking = false  # medium; breaks A8 but not critical/high

