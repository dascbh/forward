attribute = "reliability_resilience"
severity = "medium"
probe = "partial failure in a multi-step operation: exercise deploy step 1's rollback as written"
evidence = """
plan.md deploy step 1 gives the rollback as '`git revert` the release commit and push'.
`git log origin/main..HEAD` shows 28 unpushed commits (from 7ea8178 ADR-0019 accepted through 01b7c5b). They all ship in one push, together with the future bump commit.
Reverting only the release commit restores the version string and leaves every ADR-0019 behavior change on main. Clients 'pin nothing' (README ### Update), so a sync after that rollback still installs the new behavior.
In a clone, `git revert --no-commit 321e045..HEAD` applies with no conflict, and `git diff --cached 321e045` is empty. That is the rollback that works, and it is not the documented one.
"""
