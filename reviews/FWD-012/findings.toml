probe = "the anti-anglo coverage rule stops at the two new kinds. Systems must declare a `market` and the suite requires at least three distinct markets with at least one non-global, on the stated reasoning that 'a base drawn only from anglo systems exports their conventions as universal'. Frameworks declare no market and all four are anglo/global (Twitter, Tailwind Labs, ZURB); archetypes declare no market either. The consequence is visible inside the archetypes: locale obligations appear ad hoc rather than structurally — checkout's `must_resolve` names 'CPF/CNPJ, postal code' and pricing names 'currency, tax and locale stated, not assumed', while authentication, marketing-landing, content-article, catalogue-grid and not-found name none, even though pt-BR error language, LGPD consent text, and address/date formats bite on every one of them. The archetype is now the recommended entry point (SKILL.md:178), so the level with the weakest locale coverage is the level a reader reads first."
