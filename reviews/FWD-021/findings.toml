round = 4
attribute = "functional_correctness"
severity = "high"
probe = '''
Two cycles open at once inside one push make the first one's
next-cycle items vanish on a green run (scratchpad r4/p3_twoopen.py).
Scrum is off, and C-1 is closed with `none`.
- Commit X adds C-3 while C-2 is open. The same happens when C-2 and
