probe = '''
Disable / act / re-enable sandwich (scratchpad p1.py). make_project(
cycle=True), cycles/C-1.md open (XS, inline item "the thing works"),
commit "init". Commit X: fde.config.toml [cycle] enabled = false, config
only (fde.config.toml is not in behavior_paths, here or in this repo, so
X is not a behavior commit and needs no cycle). Commit Y: src/a.py
rewritten (20 lines, not RULE-eligible) AND the frozen done item
reworded to "something already true". Commit Z: enabled = true again.
`verify.py --gate cycle --since <init>`: rc 0, "0 behavior commit(s)
examined". Y's parent (X) has the mode off, so Y is never examined for
C1 or C4; Z's parent (Y) is off too. The working tree ends enabled and
`git diff init..HEAD` never touches fde.config.toml, so nothing in the
net diff shows the mode was ever off.
Variant P1b: the same three commits on a side branch, merged into main
after main moved: rc 0, "1 merge(s) with no own change". The merge's
combined diff (-c) is empty because every file equals one parent.
The declared residual (acceptance amendment, "Disabling [cycle] also
stops the gate from examining history in that run ... the disabling diff
is the evidence") covers a run whose working tree is disabled. Here the
working tree is enabled, the gate runs, prints "all declared before",
and the disabling diff is absent from the PR's net diff. FM-2 (DoD
written after the fact) and FM-3 (DoD weakened mid-cycle) both pass.
'''
evidence = "runtime/verify.py gate_cycle: `enabled = [p for p in parents if confs[p][0]]; if not enabled: continue` skips C1 and C4 for any commit whose parent had the mode off, while arming is decided by the working tree; fde.config.toml is not a behavior path (fde.config.toml:38-42). Reproduction: scratchpad p1.py, both variants rc 0."
blocking = true

