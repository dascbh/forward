opt-in, so clients that never opted in go red. This is FM-10 (critical:
"red for an existing client ... the kernel is removed"). The round-4
arming introduced it; before, only the flag armed the run.
- N5 (scratchpad r5/p3_neveropted.py). A client with no [cycle] and an
