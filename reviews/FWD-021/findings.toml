[[finding]]
id = "F31"
round = 3
attribute = "functional_correctness"
severity = "critical"
probe = '''
Merge whose FIRST parent the gate never examines, then fast-forwarded
onto the protected line (scratchpad r3/p1.py, p9.py). R2a judges a
merge against its first parent, but only "when its first parent is
examined". Whoever makes the merge chooses which parent is first, so
merging main INTO a branch whose tip is unexamined, then fast-forwarding
main, puts an unexamined commit on HEAD's first-parent line.
- P1a: C-1 closed on main. `git checkout --orphan side`, commit
  src/evil.py (20 lines) as a root; `git merge main
  --allow-unrelated-histories` on side (P1 = the orphan root); `git
  checkout main && git merge --ff-only side`. `--since <init>`, `--since
  000..0` and the default range: rc 0, "0 commit(s) examined, 0 behavior
  commit(s), all declared before (... 0 merge(s) examined)".
- P1b: the same with a branch forked BEFORE opt-in instead of an orphan
  (no --allow-unrelated-histories needed; the ordinary "merge main into my
  feature branch, then push" flow): rc 0.
- P1c: C-1 OPEN with done item "the thing works"; the orphan-side merge
  rewrites it to "it compiles"; ff. rc 0. `git diff --stat init..HEAD`:
  cycles/C-1.md and src/evil.py. A frozen declaration and undeclared code
  land together under a green row.
- P9b: orphan root with [cycle] on and code, `merge -s ours` of main
  (every cycles/ file deleted), ff: rc 0, "0 cycle(s); ... 1 merge(s)
  examined". C4's "a cycle file is never deleted" is bypassed, and the
  code in the root commit is never examined.
- P1d control, the same merge made on main (P1 = main): rc 1, "C1 <sha>
  (merge): no open cycle".
In CI this is the push path: `--since github.event.before` covers the
orphan root and the merge, both skipped. A PR merged through GitHub's
merge, squash or rebase button is judged (P1 = base); a direct or
fast-forward push is not. This repository's own flow is direct pushes
to main.
Contract statements this contradicts: acceptance R10 "A merge commit is
handled exactly as the ADR records, and never silently passed"; ADR R2a
"the gate protects the first-parent line" (the first-parent line of
HEAD is chosen by whoever makes the merge) and its residual "a merge
whose first parent is not the protected line ... is judged the same way
and may be red" (it is not judged at all); skills/fde-triage "Once the
first cycle file exists every later commit is examined, whatever the
flag says". The tests (TestF18MergesAgainstFirstParent) only build
merges whose first parent is main.
Owner decision 2026-09-28 (sprints/S-006/goal.md): "fallback: linear
history if round 3 finds a merge hole". This is that hole. Rejecting
merge commits in an examined range does not by itself close P1a/P1b
(the merge there is never examined); the fallback has to be stated as
"no merge commit anywhere in the range" (or "every commit in range has
an examined first parent, else red"), so that a root or pre-opt-in
commit can only reach HEAD by rewriting history, which R1f already makes
red after push. A root commit inside the range is skipped silently
today; the row should say so (F39).
'''
evidence = "runtime/verify.py gate_cycle: `examined_p1 = self._examined_parents(...)`; `if p1 not in examined_p1: continue` for every commit including merges; `commits = [... if c[1]]` drops roots. _examined_parents: P1 examined only by a `cycles` tree or `[cycle] enabled = true` in P1. Reproduction: scratchpad r3/p1.py (P1a, P1b, P1c rc 0; P1d rc 1), r3/p9.py (P1c re-check, P9b rc 0)."
