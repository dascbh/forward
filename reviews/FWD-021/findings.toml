[[finding]]
id = "F47"
round = 5
attribute = "functional_correctness"
severity = "high"
probe = '''
A force push whose new tip is disarmed is silent. The gate never looks
at the rewritten commits, so undeclared code lands and a frozen cycle
file is deleted, both green (scratchpad r5/p2_new.py N1).
Setup: C-1 open, then code under C-1, then X, the old tip on main.
- Rewrite: `reset --hard HEAD~1`, then one commit A that sets `[cycle]
  enabled = false`, `git rm -r cycles`, and adds a 20-line src/evil.py
  (with a tests/ file, so I1 is satisfied). Force-push A.
- CI runs `--all --since <X>`. In a fresh `git clone` of the rewritten
  repository, X does not resolve, exactly as on an actions/checkout
  runner with fetch-depth 0.
- `--gate cycle --since X`: rc 0, "cycle mode off — declared-scope gate
  not in force". `--all --since X`: no CYCLE row at all.
- Control: the same rewrite with cycles/ kept gives rc 1, "CYCLE range:
  --since <X> does not resolve (force push or shallow clone) — ...".
Cause: architecture round 4 part 0 step 5 makes an unresolvable
`--since` red "only if a or b holds; otherwise the run stays silent".
With the range unresolvable, `commits = []`, so test c (an opted parent
in the range) can never hold. A tip that clears both the flag and
cycles/ therefore disarms the whole run. A's parent is opted, and a
full-history run (all-zeros) of the same clone would examine A and give
a red C4 for the deletion.
Contract statements this contradicts. None of them is a declared
residual; each asserts the opposite:
- ADR-0017 R1g: "after push, a force push reaches R1f, which is red";
- ADR-0017 R3a residual: "R1f turns it red when the old tip does not
  resolve";
- ADR-0017 R4c, the premise the single-opt-in-point proof now rests on:
  "A force push whose old tip does not resolve is red (R1f)";
- acceptance.md (round-1 amendment): "A force push after push is red
  through the range rule";
- acceptance C4 ("a cycle file is never deleted") and C1.
This is F41's outcome (undeclared code plus a deleted frozen declaration,
then a fresh re-opt-in later) reached in one push. A pull request is
unaffected, because its base SHA resolves. Direct pushes to main are how
this repository itself works. The precondition is force-push rights on
the protected line, which R1f exists to cover.
Direction, not a fix: when `--since` is given and does not resolve, arm
from HEAD's own history, not only from a/b. For example, run the opted
test over HEAD's first-parent chain (or HEAD~1) and treat any opted
ancestor as c. A never-opted client stays silent, because none of its
ancestors is opted.
'''
evidence = "runtime/verify.py _gate_cycle: `commits = [] if bad else self._log_commits(rev)`, then `if not (a or b or opted): ... return`, with the `bad` breach never emitted; architecture.md 'Revision — round 4' part 0 step 5. .github/workflows/fde-gate.yml `--since \"${{ github.event.pull_request.base.sha || github.event.before }}\"`. Reproduction: scratchpad r5/p2_new.py N1 (keep_cycles=False: rc 0, 'not in force', no CYCLE row under --all; keep_cycles=True: rc 1, 'does not resolve')."
blocking = true

