  behavior commit, every new-branch push would be red for good.
- N3 (scratchpad r5/p2_new.py). A monorepo whose root project is opted
  (cycles/C-1.md at the root), with a nested FORWARD project pkg/ that
  never opted.
  - The nested project's `--gate cycle`, `--all --since <prev>` and
    `--all` (default) each give a red "CYCLE: the project must be the
    git top level (found prefix pkg/) — move fde.config.toml to the
