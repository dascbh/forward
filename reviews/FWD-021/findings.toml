[[finding]]
id = "F41"
round = 4
attribute = "functional_correctness"
severity = "critical"
probe = '''
A push whose HEAD is disarmed is never examined by any later
incremental run. That allows undeclared code, and a frozen declaration
can be deleted and replaced, with every push green, using only
fast-forward pushes (no merge, no force push, no history rewriting).
CI runs `--all --since github.event.before` per push. The gate is armed
only by the working tree of the commit being checked (`[cycle] enabled
is True`).
- p1_split_push.py (temporary disarm): C-1 is closed on main.
  - Push A (flag set false, plus a 20-line src/evil.py, no open cycle):
    `--since <c3>` gives "cycle mode off — not in force"; under --all
    there is no CYCLE row at all.
  - Push B (open C-2, still disarmed): green.
  - Push C (flag back to true): green, "1 examined, all declared
    before", because C is a config change judged against B, where C-2
    is open.
  - `git diff c3..HEAD` shows cycles/C-2.md and src/evil.py and no
    config change. The code reads as declared by a cycle opened after
    it.
  - Only a range covering A catches it. A PR range (`--since c3`) is
    red at A. So is a full-history run, where the R3e suffix tells the
    reader "this push did not cause it".
- p11_reroot.py (re-rooting): C-1 is OPEN, with declared tasks.
  - Push A (flag false, `cycles/` deleted, code): no CYCLE row.
  - Push B (flag true, plus more code in the same commit): green, "0
    examined, 1 pre-opt-in". B's only parent A has neither a cycles
    tree nor the flag, so B is a new opt-in point O.
  - Push C (a new cycles/C-1.md with different Tasks): green.
  - The frozen C-1 was deleted and re-declared, and two code commits
    were never judged. PR-like `--since <code>` is red: "C4 <A>:
    cycles/C-1.md was deleted".
Contract statements this contradicts:
- ADR-0017 R3a "A single opt-in point ... An opted commit never has an
  unopted child that passes". A has an opted parent and is never
  examined, because no run with A in range is armed.
- R2c "turning the flag off inside an examined range is itself a
  behavior commit". It is red only in a run that is armed and covers
  it, and per-push CI has neither.
- The residual "a permanent opt-out ... disarms the run, as before, and
  is visible in the net diff". This opt-out is temporary and invisible
  in the net diff. The ADR misstates the residual.
- fde-triage "Once the first cycle file exists every later commit is
  examined, whatever the flag says".
- acceptance "a cycle file is never deleted" (C4).
The declared residuals do not cover this. R1g's history rewriting and
force pushes are not used, and each push is an ordinary fast-forward
that branch protection with required checks would accept, since every
commit's own check is green.
Direction: arm on history, not only on the working-tree flag. For
example, arm when HEAD's tree is opted or when any commit in the range
has an opted parent, so A is examined at its own push. Or make "flag
off while cycles/ is tracked" red, as a disarm with no declaration.
'''
evidence = "runtime/verify.py gate_cycle: `sec = cfg.raw.get(\"cycle\"); if not (isinstance(sec, dict) and sec.get(\"enabled\") is True): ... return` precedes every history check; examination (`_opted_trees`) is only reached when the working tree is armed. .github/workflows/fde-gate.yml `--since \"${{ github.event.pull_request.base.sha || github.event.before }}\"`. Reproduction: scratchpad r4/p1_split_push.py (A, B, C rc 0; PR-like rc 1), r4/p11_reroot.py (A, B, C rc 0; PR-like rc 1 C4)."
blocking = true

[[finding]]
