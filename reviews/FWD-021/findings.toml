[[finding]]
id = "F52"
round = 5
attribute = "reliability_resilience"
severity = "low"
probe = '''
`--no-replace-objects` does not disable `.git/info/grafts`, so F45's
local-versus-CI split survives by a sibling mechanism (scratchpad
r5/p4_f44_f45.py, git 2.54.0).
- C-1 is closed. An undeclared commit U: `--since <close>` gives rc 1.
- Write `.git/info/grafts` with the single line `<U>`, which makes U a
  root. `git log -1 --format=%P U` is now empty.
- `--gate cycle --since <close>`: rc 0, "1 commit(s) in range: 0
  examined, 1 pre-opt-in (1 root(s))".
- All-zeros: rc 0, "1 commit(s) in range". The whole history behind U
  has disappeared.
Grafts are local and never fetched, so CI is unaffected, and this is not
a merge path. ADR R4f states the goal as "a local run judges the same
objects CI fetches", and that does not hold. Git prints a deprecation
hint for grafts, but it still honours them.
Direction: run the gate's git calls with `GIT_GRAFT_FILE` pointed at
/dev/null (or check for .git/info/grafts and give a red row), next to
--no-replace-objects.
'''
evidence = "runtime/verify.py Gate._git_global = ('--no-replace-objects',) is the only history-override guard; ADR-0017 R4f. Reproduction: scratchpad r5/p4_f44_f45.py 'grafts' section."
blocking = false

