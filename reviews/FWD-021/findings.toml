  examined ... all declared before". The report reads "C-2 closed: 2
  next-cycle item(s) — ... missing 2 (C-2#1 C-2#2)".
- Pushing X alone is red, but only through the WORKING-TREE C5 ("C5
  cycles/: 2 open cycles").
Cause:
- In history, C5 is checked only in the parent trees of behavior
  commits, and at an add only as "the number exceeds every number in P".
  An add while P already has an open cycle is not red.
