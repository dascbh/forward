[[finding]]
id = "F49"
round = 5
attribute = "functional_correctness"
severity = "medium"
probe = '''
Opting out before the first cycle file is red. The round-4 acceptance
says it is free (scratchpad r5/p2_new.py N2).
- O: a never-opted client adds `[cycle] enabled = true` and nothing
  else, with no cycle file.
- X: sets `enabled = false`, and nothing else.
- Push X (`--since O`): rc 1, "C1 <X>: no open cycle — open a cycle in
  an earlier commit; a change to [gate]/[triage]/[cycle] always needs an
  open cycle". The same row appears under --all, and in the range
  base..X.
Cause: O is opted by its flag (test c), so X is examined, and a
[cycle] change with no open cycle is red (R2c). The only green way out
the message offers is to open a cycle first. Opening one makes the mode
permanent (R4b), so no green exit exists once the flag has been
committed.
Contradicts:
- the acceptance round-4 amendment, "Before the first cycle file,
  `enabled = false` remains a free opt-out";
- ADR R4b, "Before the first cycle file exists, `enabled = false` is
  still a free opt-out, as the spec's 'opt-out of a mode' intended".
Severity reasoning: this fails closed and weakens no guarantee. The cost
is the owner-accepted R4b exit, one deliberate red commit, now also
charged to a client that only flipped the flag. The contract states a
cheaper exit than the gate delivers. Either the text or the rule must
change. Recorded as non-blocking because nothing undeclared can land
through it. The owner may weigh the acceptance wording differently.
'''
evidence = "runtime/verify.py _opted_trees (flag-only parent is opted) and _examine by_config -> _c1_reason 'no-open-cycle'; specs/FWD-021-cycle-scope/acceptance.md round-4 amendment 'Once opted, always opted'; ADR-0017 R4b last paragraph. Reproduction: scratchpad r5/p2_new.py N2."
blocking = false

[[finding]]
id = "F50"
