attribute = "functional_correctness"
severity = "medium"
probe = '''
Next-cycle items still vanish on a green run when the opt-in commit
itself holds two open cycles (scratchpad r5/p2_new.py N4). This is the
F42 class, reached through the one commit that is never examined.
- base: a never-opted client.
- O (the opt-in commit): adds `[cycle] enabled = true`, cycles/C-1.md
  (open) and cycles/C-2.md (open, empty Intake).
- X: closes C-1 with two next-cycle items ("fix the flaky thing", "p99
  latency").
- Y: a 20-line code commit under C-2.
- One push, `--since base`: rc 0, "3 commit(s) in range: 2 examined, 1
  pre-opt-in; 1 behavior commit(s), all declared before". The report
  reads "C-1 closed: 2 next-cycle item(s) — ... missing 2 (C-1#1 C-1#2)".
  Under --all the CYCLE row is green.
Why each check misses it:
- O is not examined, because its parent is unopted.
- R4d's serial check runs on X's own tree, where only C-2 is open and it
  is the highest, so it passes.
- C-2's opening check (C6) never ran, so C-1's items meet no disposition
  point.
- The working-tree C5 would catch O only if O were HEAD.
The cycle.py docstring says an open cycle is judged "in the working tree
and at the commit that adds it". Neither judges O's cycles when the push
continues past O.
Contradicts:
- acceptance "every item of a closed cycle is disposed of exactly once";
- AGENTS "One cycle is open at a time".
X, the commit that loses the items, is examined and green.
Severity reasoning: this is reachable only in the opt-in push, and it
needs an opt-in commit that already breaks C5. So it is narrower than
F42 (any time), and it is recorded non-blocking. The loss itself is F42's.
Direction: judge the opt-in commit's own cycles/ tree with C5 (and C2 for
open cycles) when it is in range. It is the commit that first creates
state every later check trusts.
'''
evidence = "runtime/verify.py _gate_cycle (commits whose parents are all unopted `continue` before any check); _serial_at runs on the examined commit's own tree only; cycle.check_opening runs only at an examined add. Reproduction: scratchpad r5/p2_new.py N4."
