'''
evidence = "runtime/verify.py _gate_cycle `b = bool(self._git_z(\"ls-files\", \"-z\", \"--\", \"cycles/\"))`; _opted_trees `ctype[1:2] == [\"tree\"]` for `<p>:cycles` (any tree); `_log_commits` over the whole repository and `<p>:fde.config.toml` / `<p>:cycles` at the repository root. Reproduction: scratchpad r5/p3_neveropted.py N5 (identical=False, red C2 strays; red C1 after a code commit), N6 (all-zeros identical=False), r5/p2_new.py N3 (nested never-opted project red under --all)."
