Direction: arm b on tracked cycle files (NAME_RE), not on any entry. The
opted test's "a cycles tree" would need the same narrowing, or a
cycles tree holding at least one C-<n>.md. Test c should skip parents
whose change is outside the project (or be skipped for a non-top-level
