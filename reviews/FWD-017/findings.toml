[[finding]]
id = "F13"
attribute = "functional_correctness"
severity = "high"
probe = '''
F10's fix (runtime/verify.py `_journey_coverage`) hardens the `script`
field: the resolved script path must be a real descendant of
`evals_dir / "journeys" / did`, closing parent-traversal, absolute-path,
and script-level symlink escapes. It does not harden the ROOT of that
containment check. `root = evals_dir / "journeys" / did` is used as-is;
`root.is_dir()` returns true for a directory-level symlink; `root_resolved
= root.resolve()` then resolves to whatever that symlink points at. If
`evals/journeys/<demand-id>` is ITSELF a symlink to another demand's real
journeys directory, every manifest and script under the target directory
is walked and containment-checked against the SYMLINK'S OWN resolved
target — which trivially contains everything under it. The demand
borrows another demand's entire, real, legitimately-authored journey
without authoring a single file of its own under its own tree.

Reproduced: demand FWD-999 has a real, legitimate manifest
(evals/journeys/FWD-999/main.journey.toml, requirements=["R1"],
script="real.spec.ts", a real file next to it) and a design surface.
Demand FWD-500 also declares R1 in its own acceptance.md and has its own
design surface, but authors NO manifest and NO script anywhere — instead,
`evals/journeys/FWD-500` is committed as a symlink pointing at
`evals/journeys/FWD-999` (a directory symlink, `target_is_directory=True`,
committed via ordinary `git add -A && git commit`, which git tracks as a
normal mode-120000 symlink blob and checks out as a real symlink — no
special git configuration needed). `verify(p, "--gate", "eval-coverage",
"--format", "json")`: I1-REQS passed=true, "2 design-surface demand(s),
every declared R# traces to a real, executed journey under its own
evals/**" — FWD-500 shows fully green having authored nothing of its own,
by borrowing FWD-999's real work through a directory-level pointer one
level above the boundary F10's fix actually checks.

This is the identical defect class F1, F2, and F10 already named across
three rounds — a demand can show coverage it did not itself author —
reached through the one boundary layer (the demand-directory root passed
into `_journey_coverage`, not the `script` leaf inside it) that the F10
fix left unguarded. The passing message's own wording, "traces to a real,
executed journey under its own evals/**," is false on both the "executed"
clause (same as F10 — nothing is ever run, only `.is_file()`/`.rglob()`)
and the "its own" clause (the directory is not FWD-500's own; it is a
pointer to FWD-999's).

Not a hypothetical: this requires no more sophistication than F10's own
reproduced cases did — a single `ln -s` (or `os.symlink` from any tool,
including an agent trying to make a red gate go green without doing the
work this demand's own title says the gate exists to require: "journeys
are executed, not narrated").
'''
evidence = '''
runtime/verify.py, `_journey_coverage` (around :215-245): `root =
evals_dir / "journeys" / did`; `root.is_dir()`; `root_resolved =
root.resolve()` — no check that `root` itself (as opposed to `script`,
which the F10 fix does check) is a real, non-symlinked descendant of
`evals_dir / "journeys"`, or that it is not a pointer to a DIFFERENT
demand-id's own tree. Reproduced against the fixture harness
(tests/support.py make_project/verify): FWD-999 (real manifest+script,
own design surface) and FWD-500 (own acceptance.md declares R1, own
design surface, `evals/journeys/FWD-500` is a directory symlink to
