[[finding]]
id = "F10"
attribute = "functional_correctness"
severity = "high"
probe = '''
F2's fix (runtime/verify.py `_journey_coverage`, :198-238) requires a
real, parsed manifest whose `script` field names a file that
`.is_file()` — a real improvement over round 1's raw-text grep. But the
existence check at :231, `(manifest.parent / str(script)).is_file()`,
applies no containment constraint: it never checks that the resolved
path stays inside the demand's own evals/journeys/<demand-id>/ tree, and
it never executes the script or checks its contents — only that SOME
file exists at the joined path. Two independent ways to satisfy "traces
to a real, executed journey" without the demand owning, authoring, or
running anything of its own:

(a) Path traversal to another demand's real script. Demand FWD-400
declares R1, its own manifest (evals/journeys/FWD-400/main.journey.toml)
sets `script = "../FWD-999/real.spec.ts"` — FWD-999's own real,
legitimate script, which verifies FWD-999's own journey, not FWD-400's.
`verify(p, "--gate", "eval-coverage", "--format", "json")`: I1-REQS
passed=true, "traces to a real, executed journey under its own
evals/**". FWD-400 authored nothing executable of its own.

(b) Absolute path to any file that happens to exist on the host. Same
demand, `script = "/bin/sh"` — a binary that exists on virtually every
Unix machine, chosen for being unrelated to anything. Python's
`Path.__truediv__` replaces the whole path when the right operand is
absolute (`manifest.parent / "/bin/sh" == Path("/bin/sh")`), so the
containing-directory join gives no protection at all.
`verify(...)` again: I1-REQS passed=true, same message.

Neither script is ever run — `_journey_coverage` never invokes anything,
it only calls `.is_file()` — so the passing detail string's own wording,
"traces to a real, EXECUTED journey," is false in both reproductions:
nothing was executed, and in case (a) the file that satisfied the check
belongs to a different demand entirely. This is the same class of defect
round 1's F1 and F2 named (a demand can show green without having
authored real, own-demand coverage) reached through the one field the F2
fix newly trusts without validating: `script`.
'''
evidence = '''
runtime/verify.py:198-238 (_journey_coverage), specifically :231
(`if not script or not (manifest.parent / str(script)).is_file():
continue` — no containment/resolve-and-check-prefix step, no execution).
Reproduced against the fixture harness (tests/support.py
make_project/verify): demand FWD-400, acceptance.md declares "R1:
WHEN...", evals/journeys/FWD-400/main.journey.toml with `[meta]
demand_id = "FWD-400"` `requirements = ["R1"]` and, in turn,
`script = "../FWD-999/real.spec.ts"` (FWD-999's own real file existing at
evals/journeys/FWD-999/real.spec.ts) and, separately, `script =
"/bin/sh"` — both give I1-REQS passed=true.
'''
blocking = true

[[finding]]
id = "F11"
attribute = "functional_correctness"
severity = "high"
probe = '''
F3's fix scopes I1-REQS checking to the demands a changeset actually
touches whenever `scoped = staged or since is not None` (runtime/
verify.py:121) is true. This correctly closes round 1's F3 (an old
demand's gap blocking an unrelated commit at the pre-commit tier) — but
it scopes the SAME way for `--since`, and this project's own CI workflow
(.github/workflows/fde-gate.yml:17) always invokes verify.py with
`--since "<base sha>"`, never bare. Since `--all` is a dead flag (see
F9's evidence — never read past argparse), there is no automated
invocation anywhere in this repository — not pre-commit, not CI — that
runs I1-REQS unscoped. The genuinely unscoped, catch-every-demand check
is only reachable by a human manually typing `python3 bin/fde/verify.py`
with no flags at all, which is neither what CLAUDE.md/AGENTS.md document
("python3 bin/fde/verify.py --all") nor what CI runs.

Consequence, reproduced: a demand whose real coverage gap predates a PR's
base commit — or simply isn't touched by the current diff — is
permanently invisible to both automated gates, not just the pre-commit
one F3's fix was scoped to fix. Built a fixture reproducing the exact CI
invocation: demand FWD-070 declares R1+R2, ships a journey for R1 only
(R2 always missing), committed as `old_sha`. A later, unrelated commit
touches only README.md. `verify(p, "--all", "--since", old_sha, "--gate",
"eval-coverage", "--format", "json")` — i.e. exactly what CI runs, gate
narrowed to eval-coverage for a clean signal — returns passed=true, "no
behavior change in this changeset". The identical fixture run fully
unscoped (no flags) correctly reports "FWD-070: R2" missing.

ADR-0013's own amendment (added by this same reconciliation commit,
closing F5) describes the mechanism accurately — "under `staged` or an
explicit `since` range, the per-demand loop now skips any demand not
touched by the changeset" — but neither the ADR nor acceptance.md records
the consequence that CI's actual, permanent invocation IS an explicit
`since` range, every time, so the record itself is technically accurate
and still misses the point spec.md's own "ask first" clause was raised
to protect: "ask whether the sharpened check belongs at the CI tier
instead" presupposes the CI tier keeps running the full check. It no
longer does. This is not a new instance of F3 — F3 was about blast
radius (a real gap blocking unrelated work); this is about disappearance
(a real gap never surfacing to anyone, ever, through any automated path).
'''
evidence = '''
runtime/verify.py:121 (`scoped = staged or since is not None` — no
distinction between the pre-commit tier and the CI tier once a `since`
value is present) and :566 (`--all` declared, never read — confirmed via
