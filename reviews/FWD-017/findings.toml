attribute = "maintainability"
severity = "medium"
principle = "MNT-9"
probe = '''
MNT-9: "scope discipline: adjacent improvements are noted for later,
never fixed in-band." The reconciliation commit's own message describes
its scope precisely: "F1-F4, F7 fixed, F5/F6 recorded." Nothing in that
message discloses that the same commit also adds a new gate id to
KNOWN_GATES, a new Gate method, and new main() wiring for a capability
(walkthrough/FWD-018) that FWD-017's own acceptance.md (line 90) and
spec.md (line 49) both explicitly name as the NEXT demand, out of scope
for this one. Judged against MNT-9: this is the opposite of "noted for
later" — it is merged in-band, silently, inside a commit whose stated
purpose is narrower, with no ADR entry, no spec note, and no commit-
message disclosure anywhere a future reader (or `git log -1 --
runtime/verify.py`) would find it. MNT-4 ("decisions are written where
the next reader will look") compounds this: there is no decision record
for "why does FWD-017's reconciliation commit also ship FWD-018's gate
skeleton" — not in the ADR (which was amended in this same commit, and
had the natural place to say so), not in acceptance.md, not in the
commit message. A future reader diffing bcbb734..ea1822d to understand
"what did reconciling round 1's findings change" has to independently
discover the walkthrough addition is unrelated — nothing tells them.

Independent of F9's breakage (this would be a finding even if
runtime/walkthrough.py did exist and the gate worked correctly): a
demand's fix-round commit is not the place to also land a different,
future demand's scaffolding. The two are now impossible to review,
revert, or reason about separately — reverting F9's breakage cleanly
means picking apart which of ea1822d's hunks belong to FWD-017 and which
belong to FWD-018, work the commit boundary was supposed to make
unnecessary.
'''
evidence = '''
git commit message for ea1822d (scoped to "F1-F4, F7 fixed, F5/F6
recorded", no mention of walkthrough/FWD-018) vs. its actual diff
(runtime/verify.py:43,471-486,629-630 — KNOWN_GATES, gate_walkthrough,
main() wiring). specs/FWD-017-journey-verification/acceptance.md:90 and
specs/FWD-017-journey-verification/spec.md:49 (FWD-018 named as the next,
out-of-scope demand). docs/adr/0013-journeys-are-executed-not-narrated.md
Amendment section (added by this same commit, covers F5/F6 only, silent
