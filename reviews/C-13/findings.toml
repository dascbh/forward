attribute = "functional_correctness"
severity = "high"
principle = "MNT-4"
probe = "cold read, case 'an M plan before sign-off': follow fde-triage (announce line), agents/fde-spec (stop at sign-off) and AGENTS.md steps 1-3 in order"
evidence = """
The rule 'An M/L plan, before sign-off: adversarial plan review' lives only in AGENTS.md step 5 'Review the demand', which comes after step 3 'Sign-off', and in fde-review / fde-adversarial.
The texts that run before sign-off never name it:
- AGENTS.md step 1: 'Announce the size in one line, commit plan.md, and stop at the sign-off'; 'Size sets only the planner's depth and the cycle review rounds'.
- skills/fde-triage/SKILL.md:90 announce template for M: 'spec + architecture + impl + demand review(1r) + cycle review(full+delta) + promotion' — no plan review.
- agents/fde-spec.md:49-51: 'Stop at the sign-off: the user signs plan.md once'.
A cold agent sizing an M cycle announces, plans and stops for sign-off without ever scheduling the plan review; it meets the rule only on reaching step 5, when the plan is already signed and frozen.
FM1's pins cover AGENTS.md step 5, fde-review and fde-adversarial only, so the disagreement with fde-triage and fde-spec is not detected. B-52 records the step-1 sentence but not the triage announce line or fde-spec's stop.
Inside the threat model: a cooperative agent choosing too light a review, on the case ADR-0021 names as the costliest catch.
"""
blocking = false  # A2's letter holds (the named texts do send the plan to review); the sequence that skips it is a text-placement defect. Backlog.
