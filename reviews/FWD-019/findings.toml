=== Broader sweep requested this round: another path into gate_rule_lane's
safety-critical logic still routing through an unhardened git call ===

Traced every call `gate_rule_lane` transitively makes before it decides
which commits to re-verify. `_commits_in_range` (F6's fix) is not the
first git call in that chain — it calls `self._resolve_range(since)`
FIRST (runtime/verify.py:151, :161-163) to get the revspec, and
`_resolve_range` (:123-138) is unchanged by this reconciliation: it calls
`self._rev_ok(since)` and, on that returning False, `self._rev_ok("HEAD~1")`
(:134-137). `_rev_ok` (:114-121) is untouched by F6's fix and still uses
the exact pre-F4/F6 pattern: `except FileNotFoundError: return False` —
any OTHER git failure (non-zero exit from a permission error, a lock, a
corrupted object, a disk I/O problem — the identical fault class F4 and
F6 were both rated blocking for) makes `subprocess.run` return normally
with a non-zero code, and `_rev_ok` reads that the same as "this revision
does not exist," returning False with no signal anything failed. This is
F9, below — reproduced end-to-end.
'''

[[finding]]
id = "F9"
attribute = "reliability_resilience"
severity = "critical"
probe = '''
"external dependency slow, intermittent, and unavailable" — the same
probe class F4 and F6 were both rated blocking for, reproduced a second
time at a THIRD call site in the identical dependency chain, one step
upstream of where F6's own fix stops.

`gate_rule_lane` -> `Gate._commits_in_range(since)` -> `Gate._resolve_range(since)`
(runtime/verify.py:123-138) -> `Gate._rev_ok(since)` then, on failure,
`Gate._rev_ok("HEAD~1")` (:114-121). `_rev_ok` still only catches
`FileNotFoundError`; a git subprocess that runs and exits non-zero for
ANY other reason returns `False` from `_rev_ok`, silently and
indistinguishably from "the revision genuinely does not exist." Because
`_resolve_range` treats "since does not resolve" as license to fall
through to the next, narrower tier, a git failure isolated to the ONE
`rev-parse --verify` call for `since` — while a LATER, different git
invocation (`rev-parse` for `HEAD~1`, or the `git log` `_commits_in_range`
itself makes via `_git_strict`) succeeds — silently swaps the intended
`since..HEAD` range (potentially many commits, exactly what CI passes via
`--since "${{ github.event.pull_request.base.sha || github.event.before }}"`,
confirmed in `.github/workflows/fde-gate.yml:17` — this is not a
hypothetical argument, it is the literal production invocation) for the
much narrower `HEAD~1..HEAD` (the single most recent commit only). Any
RULE-tagged, actually-ineligible commit that is not the exact HEAD commit
then falls entirely outside the range `_commits_in_range` ever asks git
about — not mis-scored, never examined at all. `_git_strict`'s hardening
inside `_commits_in_range` cannot catch this: by the time it runs, the
range it is asked to walk has already been silently narrowed by a step
that failed and swallowed its own failure one call earlier.

Reproduced end-to-end against the real modules, via the same
`bin/fde/verify.py` subprocess `tests.support.verify()` invokes (never a
mock), using the same fake-git-shim fault-injection technique this
reconciliation's own `tests/test_verify.py` now uses for F4/F6 (a shim on
PATH that fails one specific git invocation and delegates everything else
to the real binary — the project's own comment there notes `chmod 000` on
`.git/objects` is "environment-fragile," and the shim is the more
reliable mechanism, which is why this reproduction uses it too):

1. Built a fixture project (`tests.support.make_project`,
   `rule_lane_max_loc=10`), seeded, recorded `base = HEAD`.
2. Committed three more commits: A (1 trivial line, untagged), B (40
   added lines — over threshold — subject `FORWARD: RULE — actually not
   small`), C (1 trivial line, untagged, becomes HEAD).
3. Control, healthy git, `verify(p, "--gate", "rule-lane", "--since",
   base)`: returncode 1, `"RULE-LANE <B's sha> claims RULE but fails
   'loc': commit size 40 line(s) ... — run this demand through the normal
   XS/S/M/L table instead"` — correct, establishing this as a real
   positive before trusting the fault variant.
4. Installed a `git` shim on PATH whose ONLY special case is
   `rev-parse --verify --quiet <base>^{commit}` (the exact call
   `_rev_ok(since)` makes for THIS `since` value) — exit 128, simulating
   any of the real git failure modes F4/F6 already named (permission,
   lock, corrupted object, disk I/O); every other invocation (including
   `rev-parse --verify --quiet HEAD~1^{commit}`, and the `git log` call
   `_commits_in_range` makes) delegates to the real `git` binary
   unmodified.
5. Re-ran the IDENTICAL command with that shim on PATH:
   `verify(p, "--gate", "rule-lane", "--since", base, env=...)` now
   returns returncode 0, `"RULE-LANE no commit in range claims RULE —
   nothing to re-verify"`, `"all gates passed."` — the same genuinely-
   ineligible commit B, now outside the examined range entirely, reported
   as a clean pass. `_commits_in_range` under the fault only sees commit
   C (untagged) because `_resolve_range` silently fell back to
   `HEAD~1..HEAD`.
6. Under the true default CI shape (no `--gate`, `--since base` only,
   matching `.github/workflows/fde-gate.yml`'s own invocation) with the
   same fault: RULE-LANE is entirely ABSENT from the output (worse than
   an explicit false pass — total silence, `"RULE-LANE" in r.stdout` is
   False), returncode still 1 only because unrelated gates (I1, I2, I4,
   I5, I6, I7) fail in this bare fixture for reasons unconnected to RULE
   — a real project with those satisfied would see a clean, wrong,
   `returncode 0`. Also observed in this same run: I1's own file-list
   (`gate_eval_coverage` -> `changed()` -> the SAME `_resolve_range`)
   silently narrowed too — "3 behavior file(s)" (a.py, big.py, c.py,
   correct) under healthy git became "1 behavior file(s): src/c.py" under
   the identical fault, confirming this is not RULE-LANE-only: F3's own
   fix (unifying `changed()` and `_commits_in_range()` on one shared
   `_resolve_range`) is exactly what wires this single unhardened method
   into both I1's and ADR-0015's safety claims at once.

This directly falsifies the same acceptance-mandated review question F6
falsified in round 2 ("does gate_rule_lane actually block a commit whose
message claims RULE but whose diff exceeds any one of the four
criteria?") and the same ADR-0015 asymmetry claim ("where mechanical
certainty is unavailable, RULE defaults to never") — under this fault it
defaults to available-and-fine. It is the direct continuation of F6's own
probe one call further upstream, not a new category of bug: F6 hardened
the LAST git call `_commits_in_range` makes; this is the FIRST one,
reached before `_commits_in_range`'s own hardening ever runs.
'''
evidence = "runtime/verify.py:114-121 (Gate._rev_ok — only FileNotFoundError caught, any other git failure silently returns False), :123-138 (_resolve_range — falls through tiers on _rev_ok's unsignaled False), :151-172 (_commits_in_range — calls _resolve_range first, _git_strict second), :681-696 (gate_rule_lane — only ever examines what _commits_in_range returns); .github/workflows/fde-gate.yml:17 (confirms --since <base_sha> is the real CI invocation, not a hypothetical); reproduced end-to-end via the real bin/fde/verify.py subprocess with a git shim failing only the since-specific rev-parse call, delegating everything else to the real binary"
blocking = true
