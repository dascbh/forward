[[finding]]
id = "F12"
attribute = "reliability_resilience"
severity = "medium"
probe = '''
"external dependency slow, intermittent, and unavailable" — a git
failure mode this demand's own hardening does not cover: process-spawn
failures other than "missing from PATH." `Gate._run_git`
(runtime/verify.py:102-115, the ONE place a git subprocess is spawned as
of round 3's own refactor) catches only `FileNotFoundError`:
`except FileNotFoundError as e: raise GitOpFailure(...)`. `triage._git`
(runtime/triage.py:192-200) has the identical shape, unchanged by this
demand. Both are within this round's explicit mandate ("any OTHER
function in verify.py, triage.py... that still has an unsafe default")
— the round-3 audit's own "individually audited caller" pass reasoned
about `check=False`/non-zero-exit vs. `FileNotFoundError` specifically,
never about the broader family of `OSError` subtypes Python's
`subprocess.run` raises for other exec-time failures.

`PermissionError` is the concrete case: a `git` file present on PATH but
not executable (a corrupted install, a broken bind-mount, a container
image with the execute bit stripped from one binary) raises
`PermissionError`, not `FileNotFoundError`, from `subprocess.run` itself
— confirmed with a minimal reproduction (a non-executable shim script,
no chmod +x) before trusting this against the real module. Unlike
F4/F6/F9's class, this does NOT silently produce a false PASS — Python's
default uncaught-exception handling exits non-zero, so CI still shows
red. What it produces instead: a raw, unhandled traceback replacing this
tool's own clean, gate-labeled report entirely, and — because `main()`
has no per-gate try/except and `report()`/printing happens only once, at
the very end, after every `gate_*` call — the crash silently discards
EVERY gate result that already ran before the failing one, including
ones that would have PASSED cleanly. This is a narrower trigger than
F4/F6/F9 (it requires the ONE git resolvable on PATH to be present-but-
broken with no other working git anywhere else on PATH — POSIX exec
search skips a permission-denied PATH entry and keeps looking, confirmed
empirically: the same fault with a working git ALSO on PATH afterward
does not reproduce it at all) but is real, not hypothetical.

Reproduced end-to-end against the real `bin/fde/verify.py` subprocess,
never a mock: built a PATH containing only (a) a symlink to the real
`python3` in one directory and (b) a `git` file, present but not
`chmod +x`, as the only git anywhere on that PATH, in another. Ran
`verify(p, "--gate", "eval-coverage")` against a real fixture project.
Result: `returncode 1`, STDOUT completely empty (not even the report
header), STDERR a raw Python traceback ending
`PermissionError: [Errno 13] Permission denied: 'git'`, raised from
`subprocess.run` inside `Gate._run_git`, propagated uncaught through
`_rev_ok` -> `_resolve_range` -> `changed()` -> `gate_eval_coverage` ->
`main()`. `triage._git` shares the identical shape (same
`except FileNotFoundError as e: raise GitFailure` pattern,
runtime/triage.py:197-198) and is reachable the same way from
`_run_check`/`_run_report`/`eligibility_for_commit`, none of which catch
anything broader than `GitFailure` either — not independently
re-reproduced against triage.py's own CLI, since the mechanism (Python's
`subprocess.run` raising `PermissionError` instead of `FileNotFoundError`
for a present-but-non-executable target) is identical and already
confirmed against the real interpreter.

Lower severity than F9/F11 because it fails LOUD, not silently — the
core safety property this demand's whole history protects (never a false
PASS) is not violated here. Recorded because it is squarely inside this
round's mandate and cheaply closed the same way F4/F6/F9 were: catching
`OSError` broadly (or `FileNotFoundError, PermissionError`
specifically) at the one shared spawn point in each file, rather than
only its narrowest subtype.
'''
evidence = "runtime/verify.py:102-115 (Gate._run_git, only FileNotFoundError caught); runtime/triage.py:192-200 (triage._git, identical shape); reproduced end-to-end via the real bin/fde/verify.py subprocess with a present-but-non-executable git as the only git on a constructed PATH (python3 available via a separate symlinked directory) — returncode 1, empty stdout, raw PermissionError traceback on stderr, no gate report printed at all"
blocking = false
