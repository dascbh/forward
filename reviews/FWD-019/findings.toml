[[finding]]
id = "F6"
attribute = "reliability_resilience"
severity = "high"
probe = '''
"external dependency slow, intermittent, and unavailable" — the exact
class of probe F4 was rated high/blocking for, reproduced again here one
layer up, where the reconciliation commit's own message concedes it
applies but declines to fix it as "out of scope."

`gate_rule_lane` (runtime/verify.py:600-655) does not call git directly:
it first asks `Gate._commits_in_range(since)` (:109-124) for the (sha,
subject) pairs to examine, and ONLY commits in that returned list are
ever checked against `triage.eligibility_for_commit` at all. `_commits_
in_range` resolves its revspec via the shared `_resolve_range` (F3's own
fix) and then calls `self._git(*args)` — `Gate._git` (:63-70), which is
untouched by this reconciliation: `check=False`, no returncode check,
and only `FileNotFoundError` is caught. A git failure that is NOT
"git missing from PATH" — a permission error on `.git/objects`, a lock
held by a concurrent process, a corrupted object, a disk I/O error, a
shallow clone that cannot resolve a ref — makes `subprocess.run` return
normally with a non-zero exit code and empty stdout; `Gate._git` returns
`[]` with no signal anything failed. `_commits_in_range` then returns an
empty list, `gate_rule_lane` sees `declared = []`, and takes the
"nothing to re-verify" branch — silently under the default run, or with
an explicit, confidently-worded PASS under `--gate rule-lane` directly.
A commit that in fact declares `FORWARD: RULE` and does NOT qualify is
never examined at all, not merely mis-scored.

Reproduced end-to-end against the real modules, via the same
`bin/fde/verify.py` subprocess the test suite's own `support.verify()`
helper invokes (never a mock):

1. Built a fixture project (`tests.support.make_project`,
   `rule_lane_max_loc=10`), seeded, then committed 40 added lines with
   subject `FORWARD: RULE — actually not small`.
2. `verify(p, "--gate", "rule-lane", "--since", base)` under healthy git
   — correctly BLOCKS: returncode 1, `"RULE-LANE ... claims RULE but
   fails 'loc': commit size 40 line(s) ... — run this demand through the
   normal XS/S/M/L table instead"`.
3. `os.chmod(project/".git"/"objects", 0o000)` — a real permission
   failure on the object store, not a mock, not `FileNotFoundError` (git
   itself is still on PATH and runs; it exits non-zero because it cannot
   read the objects it needs). Re-ran the IDENTICAL command:
   `verify(p, "--gate", "rule-lane", "--since", base)` now returns
   returncode 0 with `"✓ RULE-LANE no commit in range claims RULE —
   nothing to re-verify"` and `"all gates passed."` — the same
   genuinely-ineligible commit, now invisible, reported as a clean pass.
4. Under a true default full-gate run (no `--gate`, no `--since` — the
   CI shape) with the same broken permissions: the RULE-LANE row is
   absent from the output ENTIRELY (`"RULE-LANE" in r.stdout` is False)
   — not even the falsely-reassuring explicit message, total silence.
   Restoring permissions and re-running the identical default command
   makes the row reappear and correctly fail: `"✗ RULE-LANE ... fails
   'loc'"`. Same command, same commit, same range — the only variable is
   whether `.git/objects` was readable.

This directly falsifies one of this demand's own acceptance-mandated
review questions ("does `gate_rule_lane` actually block a commit whose
message claims RULE but whose diff exceeds any one of the four
criteria?") under a realistic, non-contrived failure — permission
errors, lock contention, and disk issues on `.git` are exactly the kind
of "intermittent and unavailable" dependency behavior CI runners
experience, not a hypothetical. It also directly contradicts ADR-0015's
own stated asymmetry ("where mechanical certainty is unavailable, RULE
defaults to never") and the ADR's characterization of this gate as "the
live re-verification gate... deterministic and always-on, not a
fallible human noticing something felt off" — under this failure mode it
is neither deterministic-and-safe nor even honestly silent-by-omission;
under explicit invocation it actively asserts a false all-clear.

This is the SAME root cause F4 fixed, one call-site removed: `triage._git`
now distinguishes "git failed" from "git succeeded with nothing to
report" (raises `GitFailure`); `Gate._git` still does not, and F3's own
fix (unifying `changed()` and `_commits_in_range()` on one shared
`_resolve_range`/`_git` path) is precisely what guarantees the pre-
existing weakness in `changed()` (I1's own file-list determination —
already present before this demand, not introduced by it) now applies
identically, structurally, to `gate_rule_lane`'s commit discovery too —
this demand is what newly made that weakness load-bearing for a safety
claim it did not previously have to support. The reconciliation commit's
own message names this exact gap ("Gate._git in verify.py still silently
degrades to [] on failure, the same class of gap F4 fixed in triage.py,
one level up") and calls it out of scope; the reproduction above shows
it is not out of scope for THIS demand's own safety guarantee, whatever
its relationship to I1 — it is the direct, load-bearing continuation of
F4's own probe, and F4 was rated blocking for the identical reasoning
applied to the identical failure mode at the sibling call site.
'''
evidence = "runtime/verify.py:63-70 (Gate._git, check=False + only FileNotFoundError caught), :81-96 (_resolve_range), :109-124 (_commits_in_range), :600-655 (gate_rule_lane, only ever examines what _commits_in_range returns); reproduced end-to-end via the real bin/fde/verify.py subprocess against a real git repository with .git/objects permissions removed, not a mock"
blocking = true

