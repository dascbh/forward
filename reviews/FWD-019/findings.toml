differing only in which git subcommand each branch runs. This is not
incidental — `_commits_in_range`'s own docstring says so explicitly:
"The same --since -> HEAD~1..HEAD -> 'everything in HEAD' fallback chain
as changed()." The code itself asserts these two must always agree, yet
nothing enforces that agreement except whoever edits both. A plausible,
ordinary future change (adjust the `--since` validity check, add a
fourth tier, change what counts as "root commit") edited in one method
and missed in the other silently splits what I1's `gate_eval_coverage`
(via `changed()`) considers "this changeset" from what `gate_rule_lane`
(via `_commits_in_range`) considers it — a correctness split with no
test that would catch it, since both methods currently agree by
construction, not by a shared implementation. MNT-1 ("every fact lives
in one place; duplication is drift waiting") and MNT-8 ("repeated
conditionals on the same shape are a missing model or dispatcher") both
apply directly; the fix is a single range-resolution helper
`changed()` and `_commits_in_range()` both call, not two independently
maintained copies of the same three-tier policy.
'''
