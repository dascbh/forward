probe = '''
"external dependency slow, intermittent, and unavailable" — the exact
defect class this demand's entire three-round history chases (F4 -> F6
-> F9: any git failure other than `FileNotFoundError` silently reads as
"legitimately nothing to report," never as a failure) is ALSO present,
right now, in a sibling module reachable from the same `verify.py` gate
dispatch this demand's own reconciliation just finished hardening —
`runtime/erosion.py`'s own `_git()` wrapper (lines 194-200), unchanged by
this demand and not named in spec.md's Boundaries, but explicitly in
scope for this round's mandate ("is there any OTHER function in
verify.py, triage.py, OR THEIR INTERACTION that still has an unsafe
default" — `gate_erosion`, in verify.py, is that interaction: it imports
`erosion` and trusts `erosion.gate()`'s return value without knowing
`erosion._git()` can silently degrade).

`erosion._git()`: `except FileNotFoundError: return ""` — structurally
identical to `triage._git()`/`Gate._git()` before their own F4/F6/F9
fixes. `erosion.measure()` calls it for the churn log:
`log = _git(project, "log", f"-{window}", "--numstat", "--format=")`,
then `added, deleted, rows = parse_numstat(log, scope, gen) if
log.strip() else (0, 0, 0)` — a git failure (empty stdout, error on
stderr) is indistinguishable from "no churn in this window" and reads as
`rows=0`. `measure()`'s own comment even names the risk it thinks it
mitigates ("rows==0 is NOT zero churn: it is churn never measured...
Reporting it as a pass would be a silent green") by degrading
`add_delete_ratio`/`largest_change` to `None` rather than `0` — but
`check_budget()` treats a `None` metric as `unmeasured`, and
`gate_erosion` still reports an overall PASS for an unmeasured budget
(`self.add("EROSION", not breaches, ...)` — `breaches` stays empty either
way). The message text says "not measured"; the gate's pass/fail
VERDICT does not distinguish it from "measured, clean" — the same shape
of gap F4/F6/F9 closed for RULE-LANE and I1, just one layer more
forgiving (labeled, not silent) rather than fully closed.

Reproduced end-to-end against the real modules, via the real
`bin/fde/verify.py` subprocess, never a mock:
1. Fixture project (`tests.support.make_project`), seeded. Added
   `src/a.py` with 40 lines, committed. Declared
   `[erosion] max_add_delete_ratio = 0.01` in `fde.config.toml` (matching
   `tests/test_erosion.py::TestGate::test_declared_breach_fails`'s own
   pattern).
2. Control, healthy git: `verify(p, "--gate", "erosion")` — returncode 1,
   `"EROSION add/delete ratio 40.0 > budget 0.01"` — a real, correctly
   detected breach.
3. Installed a `git` shim on PATH whose only special case is
   `log -50 --numstat --format=` — the exact call `erosion.measure()`
   makes for churn — exit 128, everything else delegated to the real
   `git` binary unmodified.
4. Re-ran the IDENTICAL command: `verify(p, "--gate", "erosion")` now
   returns returncode 0, `"EROSION within budget, but not measured:
   add/delete ratio ... — the declared threshold had nothing to check"`,
   `"all gates passed."` — the SAME real 40.0-ratio breach, now silently
   passing (labeled "not measured" in the text a reader would have to
   read past the green checkmark to notice) purely because the git call
