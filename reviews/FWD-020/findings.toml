a fact SETUP declares about an installed copy that neither the mirror
nor the pins verify, and Decision 9 does not list it among the
residuals. Suggestion (I3): the pre-commit pin could assert
os.access(..., X_OK) on .githooks/pre-commit, or Decision 9 could name
