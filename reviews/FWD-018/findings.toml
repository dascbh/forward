[[finding]]
id = "F7"
attribute = "reliability_resilience"
severity = "medium"
probe = '''
Nothing in the perceived-model schema (R6; agents/fde-walkthrough-
evaluator.md's "What to return") represents "I could not reach or render
the target" as distinct from "I reached the target and found nothing
noteworthy" or "I reached the target and it was genuinely unclear." All
three collapse to the same shape: empty or near-empty sets in the three
scored slots.

Consequence, traced through the shipped formula: if run A hits a target
that is fully up and reports real content, and run B hits the same
target during a transient outage (a timeout, a 5xx, a blank page — the
"external dependency slow, intermittent, and unavailable" case this
attribute's own catalog names) and returns near-empty sets because there
was nothing to observe, `compute_divergence` scores this at or near 1.0
— indistinguishable from two runs that both reached a genuinely confusing
interface and read it two different ways. R9's classification step (were
it wired — F1) would have to guess, from the raw text alone, whether a
divergence traces to interface ambiguity (USE-15) or to one run simply
never having seen a working target — exactly the FM-6 confusion ("the
confrontation step misattributes a genuine implementation bug ... as an
interpretive-ambiguity finding, or the reverse") this demand names as a
risk to guard against, arriving through a channel (infra failure, not a
bug in the interface) neither category in R9's own two-way split
(functional_correctness bug vs. usability ambiguity) accounts for.
'''
evidence = '''
agents/fde-walkthrough-evaluator.md:67-86 ("What to return" — four slots,
none representing access failure); specs/FWD-018-first-contact-
