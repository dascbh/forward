[[finding]]
id = "F16"
attribute = "maintainability"
severity = "medium"
probe = '''
`_REQUIRED_FIELDS` (`runtime/walkthrough.py:79-87`) is a `dict[str,
type]` presented, in an 11-line comment, as the schema's authoritative
declaration — it even documents the `bool`-vs-`isinstance` special case
that matters for `target_unreachable`. `parse_perceived_model`'s own
docstring (:147) cites it by name as the mechanism: "seven required
top-level keys (`_REQUIRED_FIELDS`)". A reader who wants to add, remove,
or retype a required field would reasonably start by editing this dict —
it is positioned first in the file, it is the most heavily commented
declaration in the module, and it is named as if load-bearing.

It is not. `parse_perceived_model`'s actual validation is a separate,
hand-written sequence of seven individual `_require_type(data, "<name>",
<type>)` calls (:169-175) that does not iterate over `_REQUIRED_FIELDS`
or reference it in any way. Proved directly: deleting the
`"observed_text"` entry from `walkthrough._REQUIRED_FIELDS` at runtime
(`del walkthrough._REQUIRED_FIELDS['observed_text']`) and then parsing a
document that omits `observed_text` still raises `PerceivedModelError`
naming `observed_text` as missing — behavior is completely unaffected by
the mutation, because nothing reads the dict at parse time. The same
inverse holds: adding a field to `_REQUIRED_FIELDS` would silently do
nothing until a matching `_require_type` call, and a matching return-dict
entry, and a matching test fixture entry, are ALSO added by hand — four
more independent, unenforced copies of the same fact
(`_REQUIRED_FIELDS` itself, the `_require_type` call sequence, the
returned-dict literal at :201-209, and `tests/test_walkthrough.py`'s own
separate `_ALL_FIELDS` tuple and `_FIELD_SNIPPETS` dict).

This is MNT-1 ("single source of truth: every fact lives in one place;
duplication is drift waiting") in a sharper form than ordinary
duplication: `_REQUIRED_FIELDS` is not a second copy that could merely
drift from the real one — it is a DECORATIVE copy that looks like the
real one (authoritative name, detailed rationale comment, cited by the
function it appears to govern) while doing nothing. A future maintainer
following Chesterton's Fence (MNT-7) toward `_REQUIRED_FIELDS`, seeing
its careful comment, has every reason to trust it is the enforcement
point — and would ship a change that silently does not take effect. This
is exactly the class of hidden-authority gap this same rewrite's own
stated purpose was to remove from the OLD heuristic parser (multiple
independent tables — `_SECTION_ALIASES`, `_ORDERED_SLOTS`,
`_UNCLEAR_KEYWORDS_RE` — each partially authoritative, none complete by
itself); the rewrite is cleaner in every way that matters to its own
stated goal, but reintroduces one small instance of the identical shape
in its own schema declaration.
'''
evidence = '''
`runtime/walkthrough.py:72-87` (`_REQUIRED_FIELDS`'s declaration and
comment); `:147` (`parse_perceived_model`'s docstring citing it by
name); `:169-175` (the actual, independent seven-call validation
sequence); `:201-209` (the returned-dict literal, a third independent
enumeration of the same seven names). `tests/test_walkthrough.py:
162-164` (`_ALL_FIELDS`, a fourth independent tuple) and `:244-252`
(`_FIELD_SNIPPETS`, a fifth). Reproduced directly: `python3 -c "import
walkthrough; del walkthrough._REQUIRED_FIELDS['observed_text']; ...
walkthrough.parse_perceived_model(<doc missing observed_text>)"` still
raises `PerceivedModelError: missing required field: 'observed_text'`
after the dict entry naming that exact field was removed — proof the
dict is not consulted at validation time.
'''
blocking = false
