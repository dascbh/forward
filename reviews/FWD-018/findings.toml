[[finding]]
id = "F8"
attribute = "functional_correctness"
severity = "high"
probe = '''
The F2/F3 fix's positional heading-fallback (`_ORDERED_SLOTS`, runtime/
walkthrough.py:86-94) closes every case round 1 actually constructed, but
the mechanism it introduces to do so has its own narrower blind spot: it
assumes a run's document always contains exactly four headings, in the
prescribed order, so that an unrecognized heading's position among
headings-seen-so-far reliably identifies which of the four sections it
is. That assumption breaks the moment the FIRST section — "What this
is," the one section `agents/fde-walkthrough-evaluator.md`'s "What to
return" describes differently from the other three ("one line of free
prose," never given a worked heading example, unlike the three bulleted
sections which are each introduced with a bold section name in the
prompt's own list) — is rendered without an explicit heading marker at
all, as a plain opening line before the run dives into its first actual
list heading.

Reproduced directly against the shipped, unmodified module: two runs
report IDENTICAL content on all three scored slots (two primary actions,
two action-consequence pairs, two unclear points). Run A uses all four
exact prescribed headings. Run B opens with an unheaded prose line
("A storefront for buying a single digital product.") and then uses
three paraphrased headings for the rest ("Things I could do" / "What
happens next" / "Things I was not sure about") — no heading at all
recognized or counted for its first section, so `heading_index` starts
at -1 and every subsequent unrecognized heading is off by one: "Things I
could do" (meant to be `primary_actions`) resolves to `_ORDERED_SLOTS[0]`
= `what_this_is`; "What happens next" resolves to `primary_actions`;
"Things I was not sure about" resolves to `action_consequences`; the
real `unclear_points` slot is never reached at all and stays empty.
`compute_divergence(A, B)` scores 1.0 — per-slot intersection 0 on all
three slots — the exact FM-2 "fully disjoint" degenerate reading F2 was
filed to close, reproduced through a gap in the fix itself rather than
through F2's original trigger.

No test in the reconciliation's own added coverage (`tests/
test_walkthrough.py`'s `TestParsePerceivedModelHeadingAndBulletRobustness`
and `TestTargetUnreachable`) constructs a run missing an explicit "what
this is" heading — every fixture, including the ones literally named
"paraphrased," keeps `**What this is**` as an exact, recognized first
heading, which is precisely the assumption this probe breaks. This is a
plausible, not a contrived, rendering: the prompt's own phrasing singles
this one section out as "one line of free prose" rather than a titled
list, and nothing in the prompt shows a worked multi-line example proving
it needs a heading marker at all — the same "no worked example" absence
that made F2 and F3 possible in the first place, now reappearing one
level deeper in the fix meant to close it.
'''
evidence = '''
runtime/walkthrough.py:86-94 (`_ORDERED_SLOTS` comment and definition,
"assigned by ITS POSITION among the headings encountered so far") and
:150-176 (`heading_index` seeded at -1, incremented only on an
unrecognized heading, with no anchor requirement on the first section);
agents/fde-walkthrough-evaluator.md:82-96 ("What to return" — "What this
is" described as "one line of free prose," the only one of the four
sections with no worked heading example anywhere in the file, matching
round 1's F2/F3 evidence about the same file); reproduced with a
constructed pair (identical content, one side missing the first heading
entirely, remaining three headings paraphrased) against the shipped,
unmodified module — script at /private/tmp/claude-501/-Users-dascbh-
Documents-forward/1616c8e4-e620-4fcb-94f8-43d31ef57eb3/scratchpad/
probe_r2_missing_preamble.py (this review's own scratch fixture, not
committed) — score 1.0, per-slot intersection 0 on all three slots.
tests/test_walkthrough.py's PARAPHRASED_HEADINGS_A/B and the "fifth,
unexpected heading" regression case both keep an exact, recognized first
