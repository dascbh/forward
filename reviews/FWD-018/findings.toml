[[finding]]
id = "F14"
attribute = "functional_correctness"
severity = "high"
probe = '''
Two related gaps in `parse_perceived_model`'s schema validation, the
second a concrete, reproduced consequence of the first.

(1) Extra/unexpected keys are silently accepted and dropped — both at
the document's top level and nested inside each `action_consequences`
table. Reproduced directly: a document carrying all seven required
fields at their correct types PLUS an eighth key (`confidence = 0.9`)
parses cleanly, with `confidence` simply absent from the returned dict —
no error, no warning. Same result for an unexpected key nested inside an
`action_consequences` entry (`{ action = "buy", consequence = "ships",
confidence = 0.9 }` — the extra key is dropped, only `action`/
`consequence` are read). This contradicts the schema's own declared
design principle, stated in three places (`runtime/walkthrough.py:
72-78`'s comment, `agents/fde-walkthrough-evaluator.md:88-93`'s "What to
return" preamble — "there is no eighth state where you meant something
by leaving a key out" — and ADR-0014's Aug-25 amendment itself): a field
either exists at its required type or the artifact is malformed, no
guessing, no best-effort partial parse. An accepted-and-silently-dropped
extra key IS a best-effort partial parse of exactly the kind this
rewrite's whole stated purpose was to eliminate — it is simply
unaddressed by the schema rather than named as acceptable.

(2) That same leniency is what makes the ADR's own named array-of-tables
scoping trap actively dangerous rather than merely theoretical.
`agents/fde-walkthrough-evaluator.md:139-145` instructs the role to
write `action_consequences` as an inline array of tables rather than
`[[action_consequences]]` section headers, specifically to avoid the
trap where a bare `key = value` line written after a `[[section]]`
header binds to the LAST element of that array, not the document root.
That instruction is a prompt the walkthrough-evaluator role is asked to
follow — nothing in its `tools:`-restricted harness, or anywhere else,
can verify a free-text final message used one TOML form over the other.
This is the same class of unenforced "prompt instruction alone" this
very ADR amendment explicitly rejects one section earlier ("Rejected: a
fifth heuristic layer... A heading-order requirement is a prompt
instruction like any other... nothing... can check that a run's free-text
final message presented its sections in a particular order before that
text is parsed") — applied here to TOML structural form instead of
markdown heading order, but structurally the identical gap.

Reproduced end to end, through the actual CLI entry point
(`runtime/walkthrough.py --compute`, the exact command ADR-0014 assigns
to `architecture` as "the mechanical filing step"), not just the bare
function: a realistic document using `[[action_consequences]]` (the
field's own description in the schema table — "one table per primary
action" — reads naturally as "use a section per entry," the idiomatic
TOML form for repeated tables) with the four remaining required keys
following in the same order the schema table itself presents them
(`unclear_points`, `target_unreachable`, `unreachable_reason`,
`observed_text`) silently absorbs ALL FOUR of those keys as untyped
extra keys inside the last `[[action_consequences]]` table — confirmed
by inspecting the raw `tomllib.loads()` output directly (root-level keys
shrink to exactly `["what_this_is", "primary_actions",
"action_consequences"]`; the four missing keys appear instead as extra
entries on `action_consequences[1]`, silently dropped per gap (1) above
rather than triggering a shape complaint on that table). The resulting
top-level-missing-keys are then rejected — but the error message is
`malformed perceived-model file: missing required field: 'unclear_points'`,
naming only the FIRST of the four validation calls to fail
(`_require_type`'s call order in `parse_perceived_model`) and giving
zero indication that three more fields are equally missing, or that the
actual root cause is TOML table scoping rather than the run having
genuinely forgotten one field. A reader debugging this — human or
another agent — sees a file that visibly contains
`unclear_points = [...]` in its own text and a tool insisting the field
is missing, with nothing pointing at why.

Because gap (1) also means the nested extra keys inside the swallowed
table are never flagged as "unexpected" either, the diagnostic that
WOULD make this immediately legible — "action_consequences[1] has
unexpected key(s): unclear_points, target_unreachable, unreachable_reason,
observed_text" — never fires. Fixing (1) alone would turn this from a
misleading generic error into a self-diagnosing one; the trap in (2)
cannot be structurally closed (TOML's own scoping rules are what create
it), so a clear diagnostic is the realistic mitigation, and it does not
exist today.
'''
evidence = '''
`runtime/walkthrough.py:79-136` (`_REQUIRED_FIELDS`'s own comment: "ALL
seven are required, in every file, always — deliberately not a mix of
required and optional keys"; `_require_type` :126-136, which only
validates fields IN `data`, never checks `data`'s key set against the
expected seven); `:169-199` (`parse_perceived_model`'s field-by-field
validation, and the `action_consequences` table loop at :186-199, which
reads only `pair["action"]`/`pair["consequence"]` and never inspects
`pair.keys()` for anything else present). `agents/fde-walkthrough-
evaluator.md:88-93` (the "no eighth state" claim), `:139-145` (the
inline-table-array instruction and its own stated reason). ADR-0014's
"Amendment — 2026-08-25 (FWD-018 F12)", "Rejected: a fifth heuristic
layer" section (the identical "prompt instruction alone... not
enforcement" argument, applied here to TOML form instead of heading
order). Reproduced with two scratch fixtures (not committed):
extra-top-level-key and extra-nested-key documents both parsing cleanly
with the extra data silently dropped; a third fixture using
`[[action_consequences]]` with the schema table's own field order
following it, run through `python3 runtime/walkthrough.py --compute
<a> <b> --demand FWD-TEST`, producing exit code 2 and stderr `malformed
perceived-model file: missing required field: 'unclear_points'` while
the raw `tomllib.loads()` output (checked directly, same fixture)
confirms `unclear_points`, `target_unreachable`, `unreachable_reason`,
and `observed_text` were all absorbed into
`action_consequences[1]`, not merely `unclear_points` alone.
'''
blocking = true

