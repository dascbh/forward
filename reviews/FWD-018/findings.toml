[[finding]]
id = "F18"
attribute = "maintainability"
severity = "medium"
probe = '''
`_REQUIRED_FIELDS`'s own comment, added by this reconciliation commit
(`runtime/walkthrough.py:80-84`), makes an explicit, absolute claim:
"This dict is the actual, sole source of truth `_validate_table` reads
at parse time... Adding, removing, or retyping a required field means
editing exactly this one line; nothing else needs to change in step for
the new schema to take effect." True for validation (re-verified as part
of F16's disposition above). False for the field actually reaching any
caller.

Reproduced directly: added a new key to `_REQUIRED_FIELDS` at runtime
(`walkthrough._REQUIRED_FIELDS["confidence"] = str`), constructed a
document carrying all seven original fields PLUS `confidence = "high"`
at the correct type. Parsing succeeds — no error, exactly as the comment
promises for validation. But `parse_perceived_model`'s return statement
(:287-295) is a hand-written dict literal naming exactly the original
seven keys, each with its own field-specific transform
(`normalize_phrase` into a set for three of them, verbatim list for one,
verbatim scalar for three); `confidence` is not among them. The parsed
model's key set is unchanged — `sorted(m.keys())` still returns exactly
the original seven, and `"confidence" in m` is `False`. The value the
caller went to the trouble of writing, and that validation just spent a
cycle confirming exists at the right type, is silently discarded with no
error, no warning, nothing in `all_errors` — it simply never arrives.

This is a strictly worse trap than F16 itself was: before F16's fix,
`_REQUIRED_FIELDS` was honestly decorative and nobody could be misled by
trusting it. After the fix, for the REMOVE case the dict is genuinely
authoritative (correctly re-verified above) — but for the ADD case, the
dict's own comment actively promises single-point-of-change while a
second, un-cross-referenced site (the return statement) silently decides
which of the validated fields a caller ever actually sees. A future
engineer extending this schema — a plausible next step, since ADR-0014
has already been amended once to change this exact file's shape — reads
the comment, adds one line, watches every test pass (nothing currently
asserts the new field round-trips into the returned dict), and ships a
field that is enforced as mandatory on every future perceived-model file
while never being usable by anything downstream. MNT-1 ("every fact
lives in one place; duplication is drift waiting") applies here in the
opposite direction from its usual reading: the fact "which fields exist"
now has two owners (`_REQUIRED_FIELDS` for presence, the return literal
for propagation) with no mechanism keeping them in step, and the
governing comment asserts there is only one.
'''
evidence = '''
`runtime/walkthrough.py:80-84` (the comment, quoted above verbatim).
`runtime/walkthrough.py:281-295` (the return statement: a 7-key dict
literal, `.get(field, <default>)` per key, no relationship to
`_REQUIRED_FIELDS`'s key set beyond happening to name the same seven
strings today). Reproduced with a scratch script (not committed):
```
w._REQUIRED_FIELDS["confidence"] = str
m = w.parse_perceived_model(text_with_confidence_field)
sorted(m.keys())        # unchanged — still the original 7, no 'confidence'
"confidence" in m        # False
```
No test in `tests/test_walkthrough.py` constructs a document with an
eighth field and checks it appears in the returned dict —
`TestRequiredFieldsIsTheSingleSourceOfTruth` (:417-442) only tests the
REMOVE direction (popping `observed_text`), never the ADD direction, so
this gap was not exercised by the commit's own new regression coverage
either.
'''
blocking = false

