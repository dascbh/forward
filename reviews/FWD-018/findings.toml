probe = '''
F11's fix closes the specific failure it was filed against — tier 2
(content-based guess) no longer outranks tier 3 (positional guess)
unconditionally; the two are computed together and a genuine
DISAGREEMENT between them now lands the block in `model["ambiguous"]`
instead of silently misrouting it. Re-verified this holds by rebuilding
F11's own two original constructions fresh against the shipped module
(see `probed`, "F11 ITSELF" above) — both now correctly land in
`ambiguous`, not `action_consequences`.

But the fix's own code deliberately keeps ONE branch exactly as it was
before F11: "Tier 2 has no opinion at all... nothing to disagree with,
so defer to tier 3 alone, exactly as before F11" (runtime/
walkthrough.py:356-361, the branch's own comment). This branch runs
whenever `_classify_block_content` returns `None` — which is EVERY
`primary_actions` block by design (the function's own docstring:
"primary_actions and what_this_is have no equivalent tell... so those
two stay purely positional"). "Nothing to disagree with" is the load-
bearing assumption the whole branch rests on, and it is false: tier 3
alone can be wrong on its own, with nothing to catch it, independent of
whether tier 2 has an opinion.

The mechanism: an exact-alias match (tier 1, always trusted outright, no
other tier consulted) sets `heading_index = _ORDERED_SLOTS.index(heading)`
unconditionally (runtime/walkthrough.py:343-345) — it can jump the
counter forward, backward, or to the very end of `_ORDERED_SLOTS`,
purely from which of the four canonical names the alias matched, with NO
relation to how many blocks have actually been read and no monotonic
guard. The module's own comment states the assumption this requires to
be safe: position is meaningful "because the schema is always these four
sections, in this order" (runtime/walkthrough.py:122-125, unchanged by
this commit) — but nothing enforces that order. `agents/fde-walkthrough-
evaluator.md`'s "Return exactly these sections" (its own heading, "What
to return") is a bulleted list of five sections, not a sequenced
contract, and every exact-alias match is honored regardless of where in
the document it appears — a run that reports "Unclear points" before
"Perceived action -> consequence," or writes its caveats up front before
its summary of actions (an entirely ordinary report-writing habit, not a
contrived one), corrupts the position counter for everything after it,
silently, with no signal that anything happened.

Two independent constructions against the shipped, unmodified module,
both reporting IDENTICAL content and judgment on all three scored slots:

(1) Clean 4-heading reorder (script: .../scratchpad/probe_r4_clean_repro.py)
— Run A uses the four exact headings in prescribed order. Run B reports
"Unclear points" (exact alias) first, then "Perceived action ->
consequence" (exact alias, jumps `heading_index` back to 2), then a
paraphrased "Things I understood I could do" (primary_actions, content-
signature-free by design). The paraphrased block's content_guess is
`None`; deferring to position alone gives `_ORDERED_SLOTS[3]` =
`unclear_points` — WRONG. Result: `model["ambiguous"]` stays `[]` (no
flag raised at all), `primary_actions` distance 1.0 (both real actions
lost), `unclear_points` distance 0.667 (polluted with two entries that
are not unclear points at all), `action_consequences` distance 0.0,
overall score **0.556** between two runs that reported exactly the same
thing.

(2) Position-exhaustion variants (scripts: .../scratchpad/
probe_r4_silent_drop.py, score 0.167, and .../scratchpad/
probe_r4_out_of_order.py, score 0.444) — a paraphrased, content-
signature-free heading whose positional candidate index runs past the
end of `_ORDERED_SLOTS` (`position_guess = None`) hits the SAME
`content_guess is None` branch, which sets `heading = None` unconditionally
and does NOT append to `model["ambiguous"]` (only the genuine-disagreement
`else` branch at :370-386 does that) — the block's real content vanishes
from the parsed model entirely, with `model["ambiguous"]` reporting `0`
even though information was demonstrably lost.

Both are the exact FM-2 "granular enough... two runs on the same
unambiguous interface never fully agree" degenerate reading (spec.md
line 180-184) F2 was filed to close, F8 was re-filed to close a second
time, and F11 a third — now reproduced through a gap in F11's OWN fix
(specifically the one branch its own comment says is unchanged from
before F11) rather than through F11's original trigger. It also directly
contradicts the fix's own stated guarantee: `skills/fde-walkthrough/
SKILL.md`'s new "When a heading resolves ambiguously" section states "an
ambiguous block must not silently vanish either... the count is never
allowed to silently vanish," and `runtime/walkthrough.py`'s own
`compute_divergence` docstring (:456-468) makes the identical claim —
both are disproven by construction (2) above, where information is lost
with the ambiguous count reporting 0.

No test anywhere in `tests/test_walkthrough.py` — including the
reconciliation's own new `TestParsePerceivedModelContentPositionAgreementGate`
class — constructs a fixture where an exact-alias heading appears out of
the prescribed order, or where a content-signature-free paraphrase (a
primary_actions or what_this_is block) is preceded by enough alias jumps
to exhaust or misalign the positional counter. Every fixture in the
whole file, across all four rounds' additions, presents its four
headings in the exact canonical order (what_this_is, primary_actions,
action_consequences, unclear_points) — confirmed by reading every
top-level fixture constant in the file (MODEL_A/B, DISJOINT_A/B,
PARAPHRASED_HEADINGS_A/B, F11_UNCLEAR_ARROW_EXACT/PARAPHRASED,
F11_PRIMARY_ARROW_EXACT/PARAPHRASED). This is precisely the assumption
this probe breaks, and the assumption none of the last three rounds'
constructions ever varied.
'''
