[[finding]]
id = "F19"
attribute = "observability"
severity = "medium"
probe = '''
`_AC_UNEXPECTED_HINT` (`runtime/walkthrough.py:196-200`) is a single
constant string — the scoping-trap explanation F14 asked for — appended
by `_validate_table` (:190-191) to EVERY "unexpected field" error raised
for an `action_consequences` table entry, unconditionally. It is not
gated on whether the specific unexpected key found is actually one of
the seven document-root field names the scoping trap would plausibly
absorb (`unclear_points`, `target_unreachable`, etc.) — it fires for any
unrecognized key at all inside that table.

Reproduced directly with the shipped repro shape itself: a well-formed
document, `action_consequences` written correctly as an inline array
(no `[[section]]` headers anywhere, so the scoping trap literally cannot
apply), with one entry carrying an extra `confidence = 0.9` key — the
IDENTICAL fixture `TestParsePerceivedModelUnexpectedKeys::
test_extra_key_inside_action_consequences_table_is_rejected_not_silently_dropped`
already uses. The raised message: `"action_consequences[0] has
unexpected field: 'confidence' (did you mean this to be a document-root
field? a bare key = value line written after a [[action_consequences]]
section header binds to that table, not the document root...)"`. There
is no `[[action_consequences]]` header anywhere in this document and
`confidence` is not, and was never going to be, a document-root field —
the hint is actively wrong about the cause of this specific error, not
merely unhelpful.

This matters because `confidence` is not a contrived example: it is a
plausible, common thing for an LLM-authored `action_consequences` entry
to add unprompted (a self-rated confidence score), and the
`architecture` role that runs `--compute` and reads this stderr text is
itself an LLM agent, per this kernel's own operating model. A wrong hint
sends that reader — human or agent — looking for a TOML table-scoping
mistake that is not there, instead of the actual, simpler cause (an
extra hallucinated key), directly against OBS-2 ("a failure names its
cause: logs carry enough context to reconstruct the path") — naming a
plausible-sounding WRONG cause is worse for reconstructing the actual
path than naming no cause at all, which is what F14/F15 both improved on
everywhere else in this same commit.

The existing test for this exact fixture
(`test_extra_key_inside_action_consequences_table_is_rejected_not_silently_dropped`,
:344-353) only asserts `"confidence"` and `"action_consequences[0]"`
appear in the message — it does not assert the misleading hint is
ABSENT, so it passes today without exercising this gap at all.
'''
evidence = '''
`runtime/walkthrough.py:151-193` (`_validate_table`, the unconditional
`if unexpected_hint: msg += ...` at :190-191 — not conditioned on
`key in _REQUIRED_FIELDS` or any other relationship to the actual
scoping-trap keys), `:196-200` (`_AC_UNEXPECTED_HINT`'s fixed text),
`:269-271` (the one call site passing it, unconditionally, for every
`action_consequences` entry regardless of what document shape produced
the unexpected key). Reproduced with a scratch script (not committed)
running the exact fixture from
`tests/test_walkthrough.py:344-353` through
`walkthrough.parse_perceived_model` directly and printing the raised
`PerceivedModelError`'s full text — the scoping-trap hint is present in
a document that contains no `[[action_consequences]]` header at all.
'''
blocking = false
