[[finding]]
id = "F17"
attribute = "maintainability"
severity = "medium"
probe = '''
`tests/test_walkthrough.py`'s new `TestArchitectureOutputsMatchGraphExpectations`
class (added by this reconciliation commit, :749-799) carries a class
docstring that frames its whole purpose as F13 regression protection:
"the artifact that tells the `architecture` role what filename to write
... must agree with the extension `runtime/graph.py` actually looks
for — a mismatch here is a silent, gate-invisible failure." Two of its
three test methods do exactly that, deriving the expected extension from
`runtime/graph.py`'s own glob pattern via regex and asserting
`spec/roles.toml`/`agents/fde-architecture.md` match it — genuinely new,
genuinely load-bearing regression coverage for the actual F13 bug class.

The third, `test_roles_and_agent_mirrors_stay_byte_identical_to_their_source`
(:791-799), tests something else entirely: that `spec/roles.toml` bytes
equal `.fde/spec/roles.toml` bytes, and that `agents/fde-architecture.md`
bytes equal `.claude/agents/fde-architecture.md` bytes. Two problems,
verified independently:

(1) It does not test what its enclosing class's docstring says the class
tests. F13's actual bug was never "source and mirror disagree with each
other" — the commit's own words describe it as producing filenames that
"still said perceived-model-{a,b}.md" in BOTH the source and its mirror,
consistently. Simulated the exact regression directly: took the current
`spec/roles.toml` text, replaced `.toml` with `.md` in the two
`perceived-model` output lines, and used the IDENTICAL string as the
"mirror" (i.e. the F13 bug, reintroduced consistently across both
files, exactly as it existed before this reconciliation). Result:
`src_bug == mirror_bug` is `True` — the byte-identical test would PASS
on a live F13 regression. Re-running the actual extension-derivation
logic from the other two test methods against the same simulated string
correctly returns `False` — those two, and only those two, do the job
the class docstring describes.

(2) It is fully redundant with pre-existing, more general coverage that
predates this commit and was never touched by it:
`tests/test_install_sync.py::TestRuntimeCopies::test_fde_spec_is_identical_to_spec`
already asserts, for every `*.toml` file discovered under `spec/`
(including `spec/roles.toml`), byte-identity with its `.fde/spec/`
mirror; `tests/test_install_sync.py::TestClaudeLayerCopies::
test_generic_role_files_are_installed_identically` already asserts the
same for `agents/fde-architecture.md` against
`.claude/agents/fde-architecture.md` (`"architecture"` is one of the
four roles it iterates). Confirmed by reading both tests directly — the
new method reproduces exactly their combined assertion for exactly the
two files F13 happened to touch, adding no coverage `verify.py`'s test
suite did not already have before this commit. Even
`tests/test_spec_integrity.py`'s own header comment (line 181-182,
unchanged by this commit) already says as much in passing: "the
installed mirrors (`.fde/**`) are covered by the byte-identity tests,
not here" — pointing at exactly the pre-existing tests this new one
duplicates.

Net effect: a reader who trusts the class docstring walks away believing
F13's regression class has three independent layers of defense, when it
has two (both pre-existing in spirit, though the extension-derivation
ones are genuinely new and correctly targeted) plus one inert duplicate
dressed in the same class as if it were part of the same defense. This
is exactly the false-confidence risk MNT-1 names ("every fact lives in
one place; duplication is drift waiting") applied to test coverage
itself, not production code — the "fact" here (mirror byte-identity) now
lives in three places instead of one, two of which were already true
before this commit shipped.
'''
