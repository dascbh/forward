# ============================================================================
# VETOR A — ATRIBUTOS DE QUALIDADE
# ============================================================================
# Propriedades da ENTREGA. O artefato tem ou não tem, em grau mensurável.
#
# Orçamento FECHADO: a soma dos pesos deve dar exatamente `budget`.
# Isso é deliberado — se tudo pode ser 1.0, ninguém escolheu nada e o vetor não
# informa. Alocação forçada transforma preferência em decisão registrada.
#
# O peso governa:
#   - ordem de ataque da revisão adversarial e rodadas gastas por dimensão
#   - dimensionamento da suíte (failure modes e cobertura por dimensão)
#   - o que trava merge vs. o que apenas registra achado (acima do piso)
#   - ordem de trabalho quando dimensões conflitam
#
# O peso NÃO governa: nada abaixo do piso definido em spec/invariants.toml.
# ============================================================================

[meta]
vector = "A"
kind = "closed_budget"
budget = 100
weight_unit = "points"

[[attribute]]
id = "functional_correctness"
label = "Correção funcional"
question = "O sistema faz o que a especificação diz que faz?"
floor = 20
evidence = ["suíte de eval verde", "cobertura de failure modes declarados"]
adversarial_probes = [
  "entrada válida em fronteira de domínio",
  "caso que a spec não cobre e o código aceita silenciosamente",
  "regressão em comportamento previamente aceito",
]

[[attribute]]
id = "security_privacy"
label = "Segurança e privacidade"
question = "O sistema resiste a uso malicioso e protege dado de terceiro?"
floor = 8
floor_escalated_by = "triage.data_class"
evidence = ["superfície de entrada enumerada", "trilha de acesso a dado sensível"]
adversarial_probes = [
  "injeção via conteúdo observado (prompt, documento, página)",
  "escalada de permissão por confusão de papel",
  "vazamento de dado sensível em log, erro ou URL",
  "autorização ausente em caminho não óbvio",
]

[[attribute]]
id = "reliability_resilience"
label = "Confiabilidade e resiliência"
question = "O sistema degrada de forma previsível quando algo falha?"
floor = 3
evidence = ["comportamento sob falha de dependência", "idempotência em retry"]
adversarial_probes = [
  "dependência externa lenta, intermitente e indisponível",
  "retry que duplica efeito colateral",
  "falha parcial em operação multi-etapa",
]

[[attribute]]
id = "performance_scale"
label = "Performance e escala"
question = "O sistema sustenta a carga real declarada, não a carga do demo?"
floor = 3
evidence = ["medida sob volume representativo", "custo por unidade de trabalho"]
adversarial_probes = [
  "volume 10x o do dado de desenvolvimento",
  "consulta patológica / N+1 escondido",
  "concorrência no caminho de escrita",
]

[[attribute]]
id = "operational_cost"
label = "Custo operacional"
question = "O custo por unidade de valor é conhecido e sustentável?"
floor = 3
evidence = ["custo por requisição/token/execução medido", "teto configurado"]
adversarial_probes = [
  "loop de agente sem limite de passo ou orçamento",
  "custo que cresce superlinear com o uso",
]

[[attribute]]
id = "maintainability"
label = "Manutenibilidade e evolutibilidade"
question = "A equipe do cliente consegue mudar isso sem o FDE?"
floor = 3
evidence = ["decisões registradas em ADR", "onboarding executável"]
adversarial_probes = [
  "mudança plausível de requisito que exige reescrita",
  "acoplamento a detalhe de fornecedor sem camada de troca",
  "conhecimento que só existe na cabeça de quem construiu",
]

[[attribute]]
id = "observability"
label = "Observabilidade e diagnosticabilidade"
question = "É possível verificar em produção o que foi prometido?"
floor = 10
evidence = ["sinal por atributo declarado", "trilha de execução reconstruível"]
adversarial_probes = [
  "falha em produção que não deixa rastro suficiente para diagnóstico",
  "atributo declarado sem sinal correspondente",
]

[[attribute]]
id = "usability_accessibility"
label = "Usabilidade e acessibilidade"
question = "A pessoa que precisa usar isso consegue, incluindo com deficiência?"
floor = 3
evidence = ["fluxo principal percorrido por usuário real", "critério de acessibilidade declarado"]
adversarial_probes = [
  "caminho de erro sem saída clara",
  "navegação por teclado e leitor de tela no fluxo principal",
  "estado de carregamento e falha visíveis ao usuário",
]
