# ============================================================================
# VETOR B — DOMÍNIOS TÉCNICOS
# ============================================================================
# DISCIPLINAS. Trabalho que alguém faz, não propriedade da entrega.
#
# Não é orçamento fechado — é PROFUNDIDADE (0..3), e a profundidade é DERIVADA
# da detecção de stack + triagem, não escolhida pelo cliente.
#
# Override existe, mas só PARA CIMA. O cliente pode pedir mais profundidade em
# modelagem de dados; não pode pedir menos do que a natureza do sistema exige.
# Motivo: peso baixo em modelagem de dados num sistema data-heavy não é
# preferência, é erro — e o framework não deve permitir errar por configuração.
#
# Profundidade:
#   0 = não se aplica a este sistema
#   1 = coberto pelo papel de implementação, sem especialista
#   2 = especialista revisa; artefato próprio exigido
#   3 = especialista conduz; decisões registradas em ADR
# ============================================================================

[meta]
vector = "B"
kind = "derived_depth"
scale = [0, 3]
override = "upward_only"

[[domain]]
id = "software_architecture"
label = "Arquitetura de software"
artifacts = ["ADR", "fronteiras de módulo", "contrato entre componentes"]
derived_from = ["surface_count", "integration_count", "reversibility"]
min_depth_when = "sempre >= 1"

[[domain]]
id = "data_modeling"
label = "Modelagem de dados e persistência"
artifacts = ["modelo lógico", "estratégia de migração", "política de retenção"]
derived_from = ["has_database", "has_migrations", "data_class"]
min_depth_when = "has_database => >= 2"

[[domain]]
id = "api_contract"
label = "Contrato de API e integração"
artifacts = ["spec de contrato", "versionamento", "compatibilidade retroativa"]
derived_from = ["exposes_api", "consumes_external_api"]
min_depth_when = "exposes_api => >= 2"

[[domain]]
id = "design_system"
label = "Design system e UI"
artifacts = ["tokens", "inventário de componente", "estado vazio/erro/carregando"]
derived_from = ["has_frontend", "component_count"]
min_depth_when = "has_frontend => >= 1"

[[domain]]
id = "usability_research"
label = "Usabilidade e research"
artifacts = ["fluxo principal mapeado", "critério de sucesso do usuário"]
derived_from = ["has_frontend", "user_facing"]

[[domain]]
id = "qa_test_strategy"
label = "QA e estratégia de teste"
artifacts = ["failure modes enumerados", "suíte de eval", "golden dataset"]
derived_from = ["sempre"]
min_depth_when = "sempre >= 1   # profundidade 0 contradiz I1"

[[domain]]
id = "platform_delivery"
label = "Plataforma, entrega e operação"
artifacts = ["pipeline", "runbook", "estratégia de rollback"]
derived_from = ["has_ci", "deploy_target", "reversibility"]
min_depth_when = "promove para produção => >= 2"

[[domain]]
id = "applied_security"
label = "Segurança aplicada (AppSec)"
artifacts = ["modelo de ameaça", "revisão de dependência", "gestão de segredo"]
derived_from = ["data_class", "exposes_api", "auth_present"]
min_depth_when = "data_class in [pessoal, financeiro, saúde] => >= 2"
note = """
Segurança aparece nos dois vetores de propósito. No vetor A é o que a entrega
GARANTE (propriedade verificável). Aqui é QUANTO TRABALHO de especialista entra
(disciplina). Não é redundância.
"""

[[domain]]
id = "ai_agents"
label = "IA e agentes"
artifacts = ["spec de comportamento", "suíte de eval de agente", "limites de ação"]
derived_from = ["embeds_model", "has_agent_loop", "has_tool_use"]
min_depth_when = "has_agent_loop => >= 2"
