# ============================================================================
# UI REFERENCE BASE — curated criteria, never copied components
# ============================================================================
# What is curated here is DECISION CRITERIA and CANONICAL SOURCES. Never
# component code: copied components rot, bloat (MNT-11, MNT-12), drag
# licenses, and would need per-framework maintenance the kernel cannot
# honor (I6). The reader studies the canonical implementation; the kernel
# only says which one, for which job, and what it must resolve.
#
# A pattern earns an entry by RECURRENCE, not by completeness. This is a
# curated base, not an encyclopedia — the same rule that governs the
# principle catalogs.
#
# The client EXTENDS this in design/patterns.md with their own domain
# patterns. They never edit this file: it syncs to .fde/spec/references/
# and hand edits are drift.
# ============================================================================

[meta]
kind = "reference_base"
sources_checked = "2026-08-09"
spec_version = "0.10.2"

# ---------------------------------------------------------------------------
# DESIGN SYSTEMS — which one to study, for what
# ---------------------------------------------------------------------------
# `best_at` is what the system solved better than the others; `study_when`
# is the register/context that makes it the right reference (see the
# register decision in design/foundation.md).

[[system]]
id = "material"
url = "https://m3.material.io"
market = "global"
label = "Material Design (Google)"
best_at = "Android platform convention, motion and elevation semantics, adaptive layouts"
study_when = "the surface is Android, or a cross-platform product that must feel native there"

[[system]]
id = "hig"
url = "https://developer.apple.com/design/human-interface-guidelines"
market = "global"
label = "Apple Human Interface Guidelines"
best_at = "iOS/macOS platform convention, navigation semantics, gesture and focus expectations"
study_when = "the surface is Apple; deviating from HIG costs the user's existing muscle memory"

[[system]]
id = "carbon"
url = "https://carbondesignsystem.com"
market = "global"
label = "IBM Carbon"
best_at = "dense operational data, data tables, complex multi-step forms, enterprise register"
study_when = "the screen is a work console and density is the requirement, not a preference"

[[system]]
id = "primer"
url = "https://primer.style"
market = "global"
label = "GitHub Primer"
best_at = "developer tooling, code-adjacent surfaces, keyboard-first interaction, diff and review UI"
study_when = "the user is technical and lives in the product all day"

[[system]]
id = "polaris"
url = "https://polaris.shopify.com"
market = "global"
label = "Shopify Polaris"
best_at = "commerce admin, merchant workflows, resource lists, bulk operations, empty states that teach"
study_when = "the product is an admin over business objects with recurring operational tasks"

[[system]]
id = "govuk"
url = "https://design-system.service.gov.uk"
market = "uk"
label = "GOV.UK Design System"
best_at = "forms, error handling, plain language, accessibility as the default — the public-service gold standard"
study_when = "the flow is a form, an application, or anything where failure excludes a person"

[[system]]
id = "atlassian"
url = "https://atlassian.design"
market = "global"
label = "Atlassian Design System"
best_at = "collaboration surfaces, permissions and roles, cross-object navigation, notification density"
study_when = "many people act on the same objects with different rights"

[[system]]
id = "fluent"
url = "https://fluent2.microsoft.design"
market = "global"
label = "Microsoft Fluent"
best_at = "productivity suites, command surfaces (ribbons, palettes), enterprise theming"
study_when = "the product sits in a Microsoft-centric workplace or is command-dense"

[[system]]
id = "radix-shadcn"
url = "https://www.radix-ui.com/primitives"
market = "global"
label = "Radix Primitives / shadcn-ui"
best_at = "headless, accessible primitives (dialog, menu, combobox) with no visual opinion"
study_when = "the project owns its visual language but must not reimplement interaction and a11y"

[[system]]
id = "apg"
url = "https://www.w3.org/WAI/ARIA/apg/"
market = "global"
label = "W3C ARIA Authoring Practices Guide"
best_at = "the normative keyboard and screen-reader behavior of every widget"
study_when = "always, before implementing any non-trivial widget — it is the accessibility contract"

[[system]]
id = "dsgov"
url = "https://www.gov.br/ds/"
market = "br"
label = "DSGov — Design System do Governo Federal (Brazil)"
best_at = "Brazilian public-sector conventions, pt-BR form and error language, eMAG/LBI accessibility"
study_when = "the product is Brazilian public-facing or regulated — the global systems carry none of the pt-BR conventions or the local legal accessibility floor"

[[system]]
id = "po-ui"
url = "https://po-ui.io"
market = "br"
label = "PO UI (TOTVS)"
best_at = "Brazilian enterprise/ERP surfaces: dense registers, fiscal and document-heavy forms, long-lived back offices"
study_when = "the product is Brazilian business software where the user's reference is an ERP, not a consumer app"

[[system]]
id = "nimbus"
url = "https://nimbus.nuvemshop.com.br"
market = "latam"
label = "Nimbus (Nuvemshop/Tiendanube)"
best_at = "Latin American commerce admin, seller workflows, open source with published tokens"
study_when = "the product is LatAm commerce and Polaris's assumptions do not match the local merchant"

[[system]]
id = "cloudscape"
url = "https://cloudscape.design"
market = "global"
label = "AWS Cloudscape"
best_at = "cloud consoles: resource tables at scale, dense configuration, destructive infrastructure actions, split panels"
study_when = "the user administers infrastructure and a mistake costs money or uptime"

[[system]]
id = "spectrum"
url = "https://spectrum.adobe.com"
market = "global"
label = "Adobe Spectrum"
best_at = "professional creative tools: canvas-adjacent panels, tool options, complex selection, keyboard-heavy expert flows"
study_when = "the screen surrounds a workspace rather than being the work"

[[system]]
id = "ant"
url = "https://ant.design"
market = "cn"
label = "Ant Design"
best_at = "breadth of data-dense enterprise components, form-heavy back offices, tabular editing"
study_when = "the requirement is coverage of an unusual data component and the register is enterprise"

[[system]]
id = "nhs"
url = "https://service-manual.nhs.uk"
market = "uk"
label = "NHS digital service manual"
best_at = "clinical safety, health content, plain language under stress, forms where a mistake harms"
study_when = "the user is a patient or a clinician and comprehension failure has a clinical cost"

[[system]]
id = "gestalt"
url = "https://gestalt.pinterest.systems"
market = "global"
label = "Pinterest Gestalt"
best_at = "visual discovery surfaces: media-first grids, dense imagery, feed browsing"
study_when = "the content is the image and the chrome must recede"

# ---------------------------------------------------------------------------
# DIRECTORIES — where to look when nothing here fits
# ---------------------------------------------------------------------------
# Consulted BEFORE inventing a pattern (USE-11: novelty is a declared cost).
# These are the sources this base is curated from; they stay directories on
# purpose — the kernel curates criteria, it does not mirror catalogs.

[[directory]]
id = "component-gallery"
url = "https://component.gallery"
use_for = "recurrence evidence — how many EXAMPLES a component has and every name it goes by. Examples exceed distinct systems (one system can appear several times): count distinct before citing a number"

[[directory]]
id = "design-systems-repo"
url = "https://designsystemsrepo.com"
use_for = "a maintained gallery of public systems, plus articles, books and tooling"

[[directory]]
id = "awesome-design-systems"
url = "https://github.com/alexpate/awesome-design-systems"
use_for = "a large tagged list of systems: which ship components, voice & tone, a designer kit, or source"

[[directory]]
id = "design-systems-brasileiros"
url = "https://designsystemsbrasileiros.com"
use_for = "Brazilian systems, many open source — the pt-BR conventions global systems do not carry"

# ---------------------------------------------------------------------------
# FRAMEWORKS — scaffolding, not decisions
# ---------------------------------------------------------------------------
# A DIFFERENT KIND from [[system]] above. A design system encodes DECISIONS
# (which job, which convention, which states); a CSS/utility framework
# encodes LAYOUT AND MARKUP and decides no job; a block library ships
# COMPOSITIONS you still choose between. The boundary is a JUDGMENT, not a
# mechanical property — the tests check ids, required fields and
# reachability; whether an entry was filed in the right kind is a review
# question (cite MNT-3: names match the domain).
#
# `does_not_decide` is the load-bearing field: what you still owe after
# adopting it.
#
# MAINTENANCE VERDICT, so the next refresh is reproducible:
#   dormant = no commit pushed in 12 months, OR no release in 18 months,
#             measured against the repository that ships the RECOMMENDED
#             product (not a sibling repository, and never the project's
#             own marketing page)
#   active  = otherwise
# State the measured facts and the date, not just the verdict.

[[framework]]
id = "bootstrap"
url = "https://getbootstrap.com"
kind = "css-framework"
market = "global"
license = "MIT"
rationale = "the default answer for a conventional responsive page, and its example set is the most complete public catalogue of page archetypes"
best_at = "getting a conventional, responsive page standing fast; its examples are a catalogue of page archetypes"
does_not_decide = "which job the screen serves, which pattern fits it, the domain language, or any state beyond the default one — a Bootstrap page looks finished before it is designed"
maintenance = "active: last push 2026-08-08, v5.3.8 released 2025-08-26 (twbs/bootstrap checked 2026-08-09)"

[[framework]]
id = "tailwind"
url = "https://tailwindcss.com"
kind = "utility-framework"
market = "global"
license = "MIT"
rationale = "the common way a design foundation's tokens reach markup without a component layer imposing a look"
best_at = "expressing a foundation's tokens directly in markup, with no opinion about components"
does_not_decide = "anything about the job, and by design nothing about consistency — utilities make the right and the wrong composition equally easy, so design/foundation.md must carry the discipline the framework declines to"
maintenance = "active: last push 2026-08-07, v4.3.3 released 2026-07-16 (tailwindlabs/tailwindcss checked 2026-08-09)"

[[framework]]
id = "tailwind-plus"
url = "https://tailwindcss.com/plus"
kind = "block-library"
market = "global"
license = "commercial: a one-time purchase in personal and team tiers (the team tier covers a bounded headcount) — NOT a per-seat subscription. The blocks are code you copy, so the licence follows them into your repository; confirm the current terms at the source before adopting (checked 2026-08-09)"
rationale = "the largest public catalogue of marketing-register compositions, and the clearest instance in this base of the clone temptation"
best_at = "a starting composition for marketing pages: 12 hero, 15 feature, 12 pricing and 11 CTA variants among others"
does_not_decide = "which variant serves your job — and a library of near-identical variants is exactly the clone temptation the erosion research measures (MNT-11). Take ONE, adapt it into the kit, delete the rest; pasting several is how a product ends up with four hero sections"
maintenance = "commercial product, versioned alongside Tailwind (checked 2026-08-09)"

[[framework]]
id = "foundation"
url = "https://get.foundation"
kind = "css-framework"
market = "global"
license = "MIT"
rationale = "the clearest case in this base of a project whose own site and whose repositories disagree — and of a framework whose two halves have diverged"
best_at = "Foundation for Emails: the Outlook/Gmail client matrix, where ordinary CSS does not survive"
does_not_decide = "the job — and which half you are adopting: verify that first, the two are not in the same state"
maintenance = "SPLIT, and only one half is adoptable. foundation-sites is DORMANT (last push 2025-01-21, v6.9.0 released 2024-09-27). foundation-emails is ACTIVE (last push 2026-03-13, 2.5.1 released 2026-03-12). The project site claims 'active development' without distinguishing them. For the email job there is an actively maintained alternative — MJML (mjmlio/mjml, last push 2026-08-07, v5.4.0 released 2026-06-29) — so Foundation is not the only option (repositories checked 2026-08-09)"

# ---------------------------------------------------------------------------
# PATTERNS — the recurring jobs and where each is well solved
# ---------------------------------------------------------------------------
# SELECTION IS DETERMINISTIC, in this order:
#   1. `baseline = true` entries are OBLIGATIONS, not candidates — every UI
#      surface must resolve them (empty state, error recovery, primary
#      navigation). They never compete for a job. A baseline entry applies
#      only where its `platform` applies: a web-only console owes nothing
#      to a `mobile` baseline.
#   2. Among the rest, match on `job`, then EXCLUDE any entry whose
#      `platform` does not cover your surface. `all` always applies and is
#      never outranked by a narrower entry — the filter removes, it does
#      not rank.
#   3. If more than one still matches, drop those whose `fails_when`
#      describes your case. If several survive, the choice is a recorded
#      decision, not a coin flip: name the trade (USE-11).
#
# `recurrence` / `rationale` justify an entry's EXISTENCE (the curation
# rule). Neither participates in selection — a popular pattern is not
# thereby the right one.

[[pattern]]
id = "resource-list-bulk-actions"
rationale = "every admin over business objects grows a batch operation; partial failure is what most implementations miss"
job = "find, select and act on many records without leaving the list"
platform = "web"
canonical = ["polaris", "cloudscape", "nimbus"]
fits_when = "the same operation applies to many objects and the user works in batches"
fails_when = "actions are per-object and destructive — batch selection then multiplies the blast radius"
states = ["empty", "loading", "no results for filter", "partial selection", "action in progress", "partial failure"]
a11y = "APG grid; selection state announced; the action bar reachable without leaving the keyboard"

[[pattern]]
id = "master-detail"
rationale = "the canonical layout named by both Material's adaptive guidance and HIG's split view"
job = "scan a set and work one item deeply without losing place"
platform = "all"
canonical = ["hig", "spectrum", "atlassian"]
fits_when = "items are comparable and the user moves between them repeatedly"
fails_when = "the detail is long-form or the flow is one-shot — a full page beats a cramped pane"
states = ["nothing selected", "loading detail", "detail error", "item deleted while open"]
a11y = "focus moves to the detail region on selection and is announced; back returns focus to the row"

[[pattern]]
id = "progressive-form"
rationale = "GOV.UK's one-thing-per-page is the most evidenced form pattern in public service delivery"
job = "collect a long or branching set of answers without overwhelming"
platform = "all"
canonical = ["govuk", "nhs", "dsgov"]
fits_when = "questions branch, or the set is long enough that one page reads as a wall"
fails_when = "the user needs to see all answers at once to decide — then one page with sections wins"
states = ["per-step validation", "resume after abandon", "review before submit", "submit failure with input preserved"]
a11y = "one h1 per step; errors summarized at the top and linked to fields; step position announced"

[[pattern]]
id = "search-filter-facets"
rationale = "the standard answer to a set beyond scrolling; recurs in every catalogue and admin"
job = "narrow a large set to the few that matter"
platform = "web"
canonical = ["polaris", "carbon"]
fits_when = "the set exceeds what scrolling can serve and has stable dimensions to filter by"
fails_when = "the set is small or the dimensions are unstable — a single search box beats dead facets"
states = ["no query", "no results", "filters applied (visible and removable)", "slow query"]
a11y = "result count announced on change; applied filters are focusable and removable"

[[pattern]]
id = "destructive-confirmation"
rationale = "the only defence against irreversible action, and the most commonly misapplied — confirmations on reversible ones"
job = "prevent an irreversible action taken by accident"
platform = "all"
canonical = ["govuk", "cloudscape", "hig"]
fits_when = "the action is irreversible or expensive to undo"
fails_when = "the action is reversible — then undo beats a confirmation nobody reads"
states = ["confirm naming the object and the consequence", "in progress", "failure", "undo window when possible"]
a11y = "focus trapped in the dialog and returned to the trigger; the confirm button names the action, never 'OK'"

[[pattern]]
id = "async-job-feedback"
rationale = "any operation outliving its request needs it; its absence shows up as duplicate submissions"
job = "start work that outlives the request and know how it ended"
platform = "all"
canonical = ["polaris", "carbon", "atlassian"]
fits_when = "the operation exceeds a few seconds or continues after navigation"
fails_when = "the operation is fast — a spinner that flashes is worse than nothing"
states = ["queued", "running with progress or honest indeterminacy", "succeeded", "failed with cause and retry", "left the page and came back"]
a11y = "progress via aria-live polite; completion announced; never rely on color alone for outcome"

[[pattern]]
id = "inline-edit"
rationale = "recurs wherever surrounding context is what makes the value correct; its failure mode (lost input) is expensive"
job = "correct one value without a context switch"
platform = "web"
canonical = ["primer", "atlassian"]
fits_when = "the edit is a single low-risk field and the surrounding context is what makes it correct"
fails_when = "the change has side effects or needs validation against other fields — use a form"
states = ["idle", "editing", "saving", "save failed with the typed value preserved", "conflict with another editor"]
a11y = "the control is a real input with a label; escape cancels; the saved state is announced"

[[pattern]]
id = "empty-state-onboarding"
rationale = "every collection surface has a first run — a baseline obligation, not a choice"
baseline = true
job = "turn an empty screen into the first step"
platform = "all"
canonical = ["polaris", "material"]
fits_when = "always — every collection surface has a first run"
fails_when = "never; an empty state that only says 'no data' is a defect (USE-1)"
states = ["first run (teach and offer the action)", "emptied by a filter (offer to clear)", "emptied by permission (say so)", "error mistaken for empty"]
a11y = "the primary action is reachable and described; illustration is decorative and hidden from assistive tech"

[[pattern]]
id = "notification-inbox"
rationale = "recurs wherever events accumulate for a person rather than for a screen"
job = "know what happened while away, without losing what matters in noise"
platform = "all"
canonical = ["atlassian", "primer"]
fits_when = "events accumulate and demand different responses"
fails_when = "everything is equally urgent — then it is a feed, and it will be ignored"
states = ["unread vs read", "grouped by object or actor", "muted", "empty", "action taken from the notification"]
a11y = "unread conveyed beyond color; new-item count announced; no focus stealing on arrival"

[[pattern]]
id = "permission-role-editor"
rationale = "recurs in every multi-role product; effective-versus-assigned is the error nobody catches"
job = "grant and audit who can do what"
platform = "web"
canonical = ["atlassian", "carbon"]
fits_when = "more than one role acts on the same objects"
fails_when = "there are two roles and no delegation — a checkbox beats a matrix"
states = ["effective permission shown (not just assigned)", "inherited vs direct", "self-lockout prevented", "change preview before apply"]
a11y = "the matrix is a real table with headers; the effect of a change is announced, not inferred visually"

[[pattern]]
id = "dashboard-overview"
rationale = "recurs as the default landing surface; the decorative-metrics trap is why the criteria matter"
job = "answer 'is anything wrong, and what do I do next'"
platform = "all"
canonical = ["carbon", "polaris"]
fits_when = "the user opens the product to triage before acting"
fails_when = "the metrics are decorative — a dashboard nobody acts on is a screensaver"
states = ["no data yet", "stale data with its timestamp", "threshold breached", "drill-down to the underlying records"]
a11y = "every chart has a text equivalent; numbers tabular; status conveyed beyond color"

[[pattern]]
id = "command-palette"
rationale = "recurs in developer and expert tools; hiding from occasional users is its declared trade"
job = "reach anything without learning the navigation"
platform = "web"
canonical = ["primer", "fluent", "spectrum"]
fits_when = "the user is frequent, technical, or the surface area exceeds what navigation can hold"
fails_when = "the audience is occasional — a discoverable menu serves them, a palette hides from them"
states = ["empty prompt with suggestions", "no match", "recent and scoped results", "action requiring confirmation"]
a11y = "APG combobox; results announced; every palette action also exists in the visible UI"

[[pattern]]
id = "error-recovery"
rationale = "every request can fail — a baseline obligation, not a choice"
baseline = true
job = "turn a failure into a next step instead of a dead end"
platform = "all"
canonical = ["govuk", "dsgov", "material"]
fits_when = "always — every request can fail"
fails_when = "never; an error without a way out is a defect (USE-4)"
states = ["retryable (offer retry)", "permanent (explain and route)", "permission (say who to ask)", "partial (say what did land)"]
a11y = "the error is announced, not only rendered; focus moves to it; the message names cause and action, never a code alone"

[[pattern]]
id = "data-entry-table"
rationale = "recurs where volume makes per-row forms too slow; the div-grid accessibility trap is near-universal"
job = "edit many rows quickly, as in a spreadsheet"
platform = "web"
canonical = ["carbon", "ant", "po-ui"]
fits_when = "the user's mental model is already tabular and volume makes forms too slow"
fails_when = "each row needs validation against distant context — use per-row forms"
states = ["dirty rows marked", "per-cell validation", "bulk paste", "save partial failure identifying the rows"]
a11y = "APG grid with real keyboard navigation; cell coordinates announced; never a div grid"

[[pattern]]
id = "date-range-selection"
rationale = "recurs in every reporting surface; GOV.UK's typed-date evidence contradicts the default calendar reflex"
job = "bound a query in time without fighting the control"
platform = "all"
canonical = ["carbon", "material", "govuk"]
fits_when = "the range drives the whole screen and presets cover most uses"
fails_when = "a single known date is wanted — three text inputs (GOV.UK) beat a calendar"
states = ["presets vs custom", "invalid or inverted range", "timezone made explicit", "range exceeding retention"]
a11y = "typed entry always possible; the calendar is keyboard-navigable; the selected range is announced in text"

# --- added FWD-011: recurring jobs the base did not cover -------------------
# `recurrence` records the evidence that earned the entry (component.gallery
# counts how many systems implement a component). Present where measured;
# a pattern without evidence has to justify itself some other way.

[[pattern]]
id = "progressive-disclosure"
job = "reveal secondary detail in place, without losing the overview"
platform = "all"
canonical = ["carbon", "govuk", "ant"]
fits_when = "the detail is optional for the decision and the overview is what the user came for"
fails_when = "every user needs the content — hiding it behind a click buys tidiness and costs the task"
states = ["collapsed", "expanded", "one-at-a-time vs many open (declared, not accidental)", "deep-linked to an expanded item", "content still loading when expanded"]
a11y = "APG disclosure/accordion; the trigger is a button carrying aria-expanded, never a div with a chevron"
recurrence = "accordion/disclosure: 101 examples across ~74 distinct systems (component.gallery, checked 2026-08-09)"

[[pattern]]
id = "set-traversal"
job = "move through a set too large for one screen without losing your place"
platform = "all"
canonical = ["polaris", "gestalt", "primer"]
fits_when = "the set has a knowable size, or the user must return to a position or cite it"
fails_when = "infinite scroll on a set the user must audit — position becomes unaddressable and the footer unreachable"
states = ["first and last page", "unknown total", "page size changed", "returning from a detail view to the same position", "loading the next page"]
a11y = "the current page is announced; next/previous are real links or buttons, never icon-only; appended items announced"
recurrence = "pagination: 48 examples across ~46 distinct systems (component.gallery, checked 2026-08-09)"

[[pattern]]
id = "typeahead-selection"
job = "choose one value from a set too large to list"
platform = "all"
canonical = ["apg", "radix-shadcn", "ant"]
fits_when = "the option set is large, known to the system, and the user roughly knows what they want"
fails_when = "the set is small (a select wins) or the user cannot name what they want (browse and facets win)"
states = ["no input", "loading suggestions", "no match — offer to broaden or create", "selected", "free text allowed or not (declared)"]
a11y = "APG combobox; result count announced; fully keyboard-operable; never silently discard input that matched nothing"
recurrence = "combobox/autocomplete: 37 examples catalogued (component.gallery, checked 2026-08-09; examples exceed distinct systems)"

[[pattern]]
id = "file-intake"
job = "get a file from the user's device into the system, with certainty about what happened"
platform = "all"
canonical = ["polaris", "carbon", "govuk"]
fits_when = "the system needs a document the user already has"
fails_when = "the data could be typed or fetched — an upload is the most failure-prone input there is"
states = ["idle stating accepted types and size", "uploading with progress and cancel", "rejected naming the reason", "uploaded and replaceable", "partial failure in a multi-file set"]
a11y = "a real file input reachable by keyboard; drag-and-drop is an enhancement, never the only path; each error tied to the file that failed"
recurrence = "file upload: 32 examples catalogued (component.gallery, checked 2026-08-09; examples exceed distinct systems)"

[[pattern]]
id = "hierarchy-orientation"
job = "know where you are in a structure and move up it"
platform = "web"
canonical = ["carbon", "govuk", "atlassian"]
fits_when = "content nests more than two levels and users arrive by deep link"
fails_when = "the structure is flat, or the path shown is not how the user got here — a breadcrumb that lies is worse than none"
states = ["deep-linked arrival", "long path truncated in the middle", "current level not a link", "moving to a sibling at the current level"]
a11y = "nav landmark with a label; the current item marked aria-current; truncation still exposes the full path"
recurrence = "breadcrumbs: 55 examples, tree view: 14 (component.gallery, checked 2026-08-09; examples exceed distinct systems)"

[[pattern]]
id = "primary-navigation"
baseline = true
job = "reach the few destinations that matter, at whatever size the viewport is"
platform = "all"
canonical = ["material", "hig", "cloudscape"]
fits_when = "always — every product has primary destinations; the choice is which form, never whether"
fails_when = "never as a job; the failure is choosing the form by taste instead of by size and count"
states = ["compact: bottom bar for 3-5 peer destinations (a drawer at this size hides them)", "medium: rail", "expanded: drawer as the primary form", "current destination indicated in every form", "position preserved per destination across a form switch", "deep-link arrival"]
a11y = "the destination set is identical in every form; current announced as selected; targets at least 44pt at compact; switching forms never traps focus"
recurrence = "Material 3 specifies navigation bar, rail and drawer as one adaptive family (m3.material.io/components, checked 2026-08-09); HIG names the equivalent tab bar and sidebar"

# ---------------------------------------------------------------------------
# ARCHETYPES — page-level compositions
# ---------------------------------------------------------------------------
# The level ABOVE a pattern: a whole page that recurs across products.
#
# BASELINES STILL APPLY. `composed_of` names the patterns SPECIFIC to this
# page; every `baseline = true` pattern whose platform covers the surface
# applies to every archetype and is deliberately not repeated here. Starting
# at an archetype never discharges a baseline obligation.
#
# SELECTION: match on `job`, then drop any whose `fails_when` describes your
# case. If two still fit (a blog index is both content-article and
# catalogue-grid), the choice is a recorded decision naming the trade.
#
# `canonical` = design systems whose DOCUMENTATION to study.
# `examples`  = frameworks that ship a SCAFFOLD of this page. Different
#               things: one is a decision to read, the other is code to
#               start from and adapt (never to paste several of).
# Marketing-register pages are the case where `canonical` is empty — the
# register design systems document least, which is itself the signal: the
# frameworks are the only reference, so the decision support is on you.

[[archetype]]
id = "authentication"
rationale = "every product with an account has one, and its failure modes are security-relevant, not cosmetic"
job = "let a returning person back in, and fail without telling an attacker anything"
fits_when = "the product has accounts"
fails_when = "the surface is public and identity is optional — an auth wall on a read-only page is a lost visit"
composed_of = ["progressive-form", "error-recovery"]
canonical = ["govuk", "dsgov"]
examples = ["bootstrap"]
must_resolve = ["password managers can fill and save it", "the error never reveals which field was wrong", "rate limiting is visible before it locks", "second factor and its recovery path", "session expiry returns to where the user was", "the forgot path actually returns"]
evidence = "Bootstrap ships a sign-in example; GOV.UK documents the error language; every design system documents the form (checked 2026-08-09)"

[[archetype]]
id = "pricing"
rationale = "the page where a comprehension failure costs the sale, and the one most often written by whoever ships last"
job = "let someone choose a plan and understand what they will actually pay"
fits_when = "the product is self-serve and the plan is chosen before contact"
fails_when = "every deal is negotiated — a price grid then invents numbers sales will contradict"
composed_of = ["progressive-disclosure"]
canonical = ["polaris"]
examples = ["bootstrap", "tailwind-plus"]
must_resolve = ["currency, tax and locale stated, not assumed", "monthly/annual toggle and which is shown by default", "the comparison table at small widths", "the enterprise 'contact us' tier", "what happens on downgrade or cancel"]
evidence = "Bootstrap ships a pricing example; Tailwind Plus ships 12 pricing sections and 3 pricing pages (checked 2026-08-09)"

[[archetype]]
id = "checkout"
rationale = "the highest-cost failure surface in any commerce product: an error here loses money already committed"
job = "take payment without losing the customer or the order"
fits_when = "money changes hands in the product"
fails_when = "the purchase is a contract signed elsewhere — a checkout then fakes a completion the business does not honour"
composed_of = ["progressive-form", "destructive-confirmation", "async-job-feedback"]
canonical = ["polaris", "nimbus"]
examples = ["bootstrap"]
must_resolve = ["guest versus account, decided not defaulted", "the back button mid-flow", "address and document formats per locale (CPF/CNPJ, postal code)", "price or stock changing mid-flow", "failure AFTER the charge — the worst state, and the one most often unhandled", "the receipt reaching the customer"]
evidence = "Bootstrap ships a checkout example; Polaris and Nimbus document the flow end to end (checked 2026-08-09)"

[[archetype]]
id = "dashboard-shell"
rationale = "the frame every other screen lives inside; getting it wrong taxes every task in the product"
job = "hold the product's surfaces together and open on what needs attention"
fits_when = "the product has several surfaces a person moves between all day"
fails_when = "the product is one task — a shell around a single screen is chrome charging rent"
composed_of = ["dashboard-overview"]
canonical = ["carbon", "cloudscape"]
examples = ["bootstrap"]
must_resolve = ["the first run, before any data exists", "permissions hiding destinations without breaking the layout", "deep-linking into a collapsed section", "one slow widget not blocking the page", "what the shell shows while the user's context loads"]
evidence = "Bootstrap ships a dashboard example; Carbon and Cloudscape both document the shell (checked 2026-08-09)"

[[archetype]]
id = "marketing-landing"
rationale = "the highest-traffic page in most products and the least documented by design systems — the gap is the reason it earns an entry"
job = "make one claim land and one action obvious"
fits_when = "the visitor arrives without context and owes the product nothing"
fails_when = "the reader already decided and came to do something — a landing page in front of a logged-in task is a toll booth"
composed_of = ["progressive-disclosure"]
canonical = []
examples = ["tailwind-plus", "tailwind", "foundation", "bootstrap"]
must_resolve = ["exactly one primary action (a second halves both)", "the claim survives 200% zoom and a narrow viewport", "no layout shift when the hero media loads", "the page is usable before JavaScript", "FAQ as disclosure, not a wall"]
evidence = "Tailwind Plus ships 12 hero, 15 feature, 11 CTA and 6 logo-cloud variants plus 4 landing examples; Bootstrap ships cover, heroes and features (checked 2026-08-09)"

[[archetype]]
id = "content-article"
rationale = "reading is a distinct job from browsing, and the two get merged into one template constantly"
job = "let someone read a long thing and find the next one"
fits_when = "the unit of value is the text and the visit is a read"
fails_when = "the reader is scanning for one fact — then it is a reference page, and prose buries the answer"
composed_of = ["hierarchy-orientation", "set-traversal"]
canonical = ["govuk"]
examples = ["bootstrap", "foundation"]
must_resolve = ["reading width and heading hierarchy", "where the reader is in a long piece", "what to read next without a dead end", "content behind auth or a paywall stating so before the scroll", "print and reader modes not breaking"]
evidence = "Bootstrap ships a blog example; Tailwind Plus ships blog and content sections; GOV.UK documents content pages (checked 2026-08-09)"

[[archetype]]
id = "catalogue-grid"
rationale = "the browse surface of every commerce and media product, where the failure (a ragged grid, a lost position) is structural rather than visual"
job = "browse a set of things that are mostly images"
fits_when = "the items are visually distinguishable and the visit is a browse"
fails_when = "the decision needs comparison of attributes — a table beats a grid when the differences are numbers"
composed_of = ["search-filter-facets", "set-traversal"]
canonical = ["gestalt", "nimbus"]
examples = ["bootstrap"]
must_resolve = ["mixed aspect ratios without a ragged grid", "no results, distinguished from not-yet-loaded", "returning from an item to the same scroll position", "pagination versus infinite scroll, decided against the audit need", "images failing without collapsing the layout"]
evidence = "Bootstrap ships album and product examples; Gestalt exists for this register (checked 2026-08-09)"

[[archetype]]
id = "not-found"
rationale = "the page nobody designs and everybody reaches; a dead end here ends the visit"
job = "turn a wrong address into a next step"
fits_when = "always — every routed product produces wrong addresses"
fails_when = "never as a page; the failure is treating it as decoration instead of recovery"
composed_of = ["error-recovery"]
canonical = ["govuk"]
examples = ["tailwind-plus"]
must_resolve = ["says what was not found, not just that something was not", "offers search and a way home", "distinguishes gone from never-existed from no-permission", "is logged, so the broken link gets fixed", "keeps the product's chrome so the user is not ejected"]
evidence = "Tailwind Plus ships 5 404 variants; GOV.UK documents the error page (checked 2026-08-09)"
