# fde.config.toml - the project's single declarative file.
# Versioned. Auditable diff. Recompilable with `fde sync`.
#
# There is NO key here to turn off an invariant. Invariants live in
# .fde/spec/invariants.toml and have no key. Weight moves rigor upward or
# redistributes emphasis; it never goes below the floor.
#
# Yes: this is FORWARD installed on FORWARD (ADR-0007).

[project]
name = "forward"
kernel_version = "0.10.0"

[triage]
data_class = "public"             # open Apache-2.0 repository, no third-party data
reversibility = "reversible"      # git revert; nothing deploys to production
user_facing = false
has_agent_loop = false

[stack]
languages = ["python"]
test_runners = ["unittest"]
test_command = "python3 -m unittest discover -s tests"
eval_command = "python3 bin/fde/verify.py --gate eval"

[gate]
# Per ADR-0001 the instructions ARE the runtime — so they are behavior.
# The installed copies (bin/fde/, .fde/, .claude/, workflow, AGENTS.md) are
# what CI and agents actually execute: change-controlled too (finding F4);
# their eval is the source/copy identity suite in tests/test_install_sync.py.
behavior_paths = [
  "runtime/", "spec/", "skills/", "agents/", "templates/", "SETUP.md",
  "bin/fde/", ".fde/", ".claude/", ".github/workflows/", "AGENTS.md", "CLAUDE.md",
]
eval_paths = ["tests/", "evals/"]

# ---------------------------------------------------------------------------
# VECTOR A - quality attributes. CLOSED budget: sum = 100.
# Correctness of the gates IS the product; maintainability is what agents
# read; usability here means the ergonomics clients complained about.
# ---------------------------------------------------------------------------
[weights]
functional_correctness = 30
maintainability = 22
reliability_resilience = 12
usability_accessibility = 12
observability = 10
security_privacy = 8
performance_scale = 3
operational_cost = 3

# ---------------------------------------------------------------------------
# VECTOR B - technical domains. DERIVED from stack + triage.
# Override in [depths] is upward-only: you raise, never reduce.
# ---------------------------------------------------------------------------
[derived.depths]
software_architecture = 1
data_modeling = 0
api_contract = 0
design_system = 0
usability_research = 0
qa_test_strategy = 1
platform_delivery = 1
applied_security = 0
ai_agents = 0

[depths]

[tooling]
tools = ["claude-code"]

[scrum]
enabled = true

# Exhibit A (ADR-0011): the kernel gates its own decay. Current signals
# leave honest headroom — a real regression trips the gate, normal growth
# does not. window excludes nothing; max_change_lines is omitted because
# the root commit (2896 lines) is still in the window.
[erosion]
window = 50
max_add_delete_ratio = 12.0
max_duplication_pct = 6.0

